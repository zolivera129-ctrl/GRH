<script>/* nivel.js — recursos de "nível de filme" (api.fx e api.tipo).

   Nasceram do porte das cenas de um filme aprovado para os exemplos de nível
   (exemplos-de-nivel/): é o que aquelas cenas faziam à mão e que toda cena com luz, vidro e
   tipografia viva precisa. Tudo genérico (cores só por token), tudo função pura de t.

   No montar (medem e preparam, uma vez):
     const frente = api.tipo.frenteDeLetras(partes, { distancia: (p) => p.cx - x0, frente: [0.12, 0.27] });
     const od = api.tipo.prepararOdometro(el.$('.data'));
   No quadro:
     frente.quadro(t)                                   letras acendem de um ponto, quentes, e assentam
     api.tipo.odometro(t, od, { inicio: 2.3, trava: 3.0 })
     api.tipo.escorrerDestaque(t, partes, { sobra: 0.12, periodo: 3.4 })
     api.fx.frenteDeLuz(el.$('.onda'), t, { centro, caixa, raio, inicio, fim })
     api.fx.luzDoVidro(card, t, { k, luz })
   Helpers: api.fx.degradeLargo(imagem, W, H, margem), api.fx.tempoDaFrente(dist, { inicio, fim, raio }),
   api.deslize(t, t0, t1, rampa). CSS: .m-vidro / .m-vidro-forte / .m-vidro-heroi em motor/nivel.css. */
(function () {
  'use strict';
  Motion.estender((api, ctx) => {
    const { clamp, lerp, prog, ease, suave5, tw } = api;
    const R = ctx.R;
    const palco = ctx.palco;
    const NS = 'http://www.w3.org/2000/svg';
    const escalaPalco = () => palco.getBoundingClientRect().width / palco.offsetWidth || 1;
    const pxCss = (el, prop) => parseFloat(getComputedStyle(el)[prop]) || 0;

    /** Deriva que não para: a velocidade sobe em `rampa` s e fica constante; vale 0 em t0 e 1 em t1
        (passa pelo valor aprovado em t1 e segue andando). Para derivas lentas que emendam no gesto
        seguinte sem estado parado. */
    function deslize(t, t0, t1, rampa = 0.5) {
      const g = (x) => (x <= 0 ? 0 : x < rampa ? (x * x) / (2 * rampa) : x - rampa / 2);
      return g(t - t0) / (g(t1 - t0) || 1);
    }
    api.deslize = deslize;

    /* ─── degradê largo ───────────────────────────────────────────────────────────────────────
       A mesma pintura de um linear-gradient de caixa W×H, numa imagem (1 + 2m)·W mais larga, com as
       pontas lisas na cor da ponta. Posicionada em −m·W é idêntica ao original; deslocada, o degradê
       deriva sem nunca mostrar a borda da imagem. Paradas em %, convertidas em px ao longo da linha
       do degradê (ângulo e cores não mudam). Use com a imagem COMPUTADA (rgb(...) N%). */
    function degradeLargo(imagem, W, H, m = 0.16) {
      const deg = /(-?[\d.]+)deg/.exec(imagem);
      const a = ((deg ? parseFloat(deg[1]) : 180) * Math.PI) / 180;
      const len = (w) => Math.abs(w * Math.sin(a)) + Math.abs(H * Math.cos(a));
      const W1 = W * (1 + 2 * m), L0 = len(W), pad = (len(W1) - L0) / 2;
      const paradas = [...String(imagem).matchAll(/(rgba?\([^)]*\))\s+(-?[\d.]+)%/g)].map(([, c, p]) => `${c} ${(pad + (parseFloat(p) / 100) * L0).toFixed(2)}px`);
      if (paradas.length < 2) return { img: imagem, W1: W, m: 0 };
      return { img: `linear-gradient(${deg ? deg[1] : 180}deg, ${paradas.join(', ')})`, W1, m };
    }

    /* ─── o destaque escorre (vida no hold) ───────────────────────────────────────────────────
       Partes divididas de um .destaque (tipo.dividir): cada fatia mostra uma janela (1 + sobra)
       maior do degradê, que oscila devagar. A palavra continua indo da primeira à última cor. */
    function escorrerDestaque(t, partes, { sobra = 0.12, periodo = 3.4, ref = api.ref, amp = 0.45, inicio = null, rampa = 0.8 } = {}) {
      const env = inicio == null ? 1 : suave5(prog(t, inicio, inicio + rampa));
      const d = sobra * (0.5 + amp * env * Math.sin((2 * Math.PI * (t - ref)) / periodo));
      for (const p of partes) {
        const el = p.el || p;
        if (!el.__mEsc) {
          const [bw, bh] = (el.style.backgroundSize || '').split(' ').map(parseFloat);
          const [px, py] = (el.style.backgroundPosition || '').split(' ').map(parseFloat);
          if (!(bw > 0)) continue;
          el.__mEsc = { bw, bh, px, py };
        }
        const b = el.__mEsc;
        el.style.backgroundSize = `${(b.bw * (1 + sobra)).toFixed(2)}px ${b.bh.toFixed(2)}px`;
        el.style.backgroundPosition = `${(b.px - d * b.bw).toFixed(3)}px ${b.py.toFixed(2)}px`;
      }
    }

    /* ─── letras que acendem de um ponto ──────────────────────────────────────────────────────
       Uma frente de luz corre de um ponto (o símbolo da marca, um ponto de luz) para as pontas e
       cada letra acende quando ela passa: nasce do desfoque, quente (mais clara, com halo), um fio
       menor e mais perto do ponto, e assenta para fora enquanto esfria. A mais longe acende por
       último e entra em foco quase junto com as de dentro. distancia(p) em cqw (negativa à esquerda
       do ponto). Devolve { quadro(t, { escala }), recuo(t, d), inicio(d), partes }. */
    function frenteDeLetras(partes, op = {}) {
      const { distancia = (p) => p.cx, frente = [0.12, 0.27], dur = 0.3, assentar = 0.05, calor = 1.3, encolher = 0.06, desfoque = 0.42, halo = 0.6, cor = 'var(--brilho, #fff)' } = op;
      const lista = partes.map((p) => ({ el: p.el || p, d: distancia(p) }));
      const D = Math.max(...lista.map((L) => Math.abs(L.d))) || 1;
      const inicio = (d) => frente[0] + (frente[1] - frente[0]) * Math.pow(Math.min(1, Math.abs(d) / D), 1.2);
      const assentado = (d, t) => ease.forte(prog(t, inicio(d), inicio(d) + 0.45));
      const recuo = (t, d) => -assentar * d * (1 - assentado(d, t));
      // a mais perto do ponto fica por cima: as de fora saem de trás das de dentro
      [...lista].sort((a, b) => Math.abs(a.d) - Math.abs(b.d)).forEach((L, i) => {
        if (getComputedStyle(L.el).position === 'static') L.el.style.position = 'relative';
        L.el.style.zIndex = String(lista.length - i);
      });
      const brilhoCss = (b) => (b > 0.002 ? `drop-shadow(0 0 ${(1.3 * b).toFixed(3)}cqw color-mix(in srgb, ${cor} ${Math.round(85 * Math.min(1, b))}%, transparent))` : '');
      function quadro(t, { escala = 1, aplicar = true } = {}) {
        return lista.map((L) => {
          const s0 = inicio(L.d);
          const quente = 1 - ease.outCubic(prog(t, s0, s0 + lerp(0.45, 0.32, clamp(Math.abs(L.d) / D))));
          const v = (Math.abs(recuo(t + 0.008, L.d) - recuo(t - 0.008, L.d)) / 0.016) * escala;
          const st = {
            pre: '',
            x: recuo(t, L.d),
            s: lerp(1 - encolher, 1, assentado(L.d, t)),
            o: ease.bezier(0.25, 0.1, 0.25, 1)(prog(t, s0, s0 + 0.14)),
            blur: desfoque * (1 - ease.forte(prog(t, s0, s0 + dur))) + Math.min(0.3, v * 0.003),
            bright: 1 + calor * quente,
            filter: brilhoCss(halo * quente),
          };
          if (aplicar) api.set(L.el, st);
          return st;
        });
      }
      return { quadro, recuo, inicio, partes: lista, D };
    }

    /* ─── odômetro ───────────────────────────────────────────────────────────────────────────
       Um número (ou data) cujos algarismos rolam como um tambor e travam um a um, da esquerda para
       a direita, cada um no seu algarismo final. Os algarismos rolam 100 % (sem troca cruzada), cada
       um com a largura dele, centrado na coluna, e o degradê do número segue contínuo; desfoque só
       vertical enquanto a velocidade é alta. O elemento precisa pintar o número com
       background-clip: text (ex.: background-image: var(--destaque-grad)). */
    let contadorOdo = 0;
    function prepararOdometro(el, { passos = (i) => 4 + 2 * i } = {}) {
      if (typeof el === 'string') el = R.conteudo.querySelector(el);
      if (!el) return null;
      const k = escalaPalco();
      const imagem = getComputedStyle(el).backgroundImage;
      el.style.whiteSpace = 'nowrap';
      const letras = api.tipo.dividir(el, { por: 'letra', kerning: false }).map((p) => p.el);
      const texto = letras.map((c) => c.textContent).join('');
      el.style.background = 'none';
      const pad = 0.12 * pxCss(el, 'fontSize');
      let svg = document.getElementById('m-fx-svg');
      if (!svg) {
        svg = document.createElementNS(NS, 'svg');
        svg.id = 'm-fx-svg';
        svg.setAttribute('width', '0');
        svg.setAttribute('height', '0');
        svg.setAttribute('aria-hidden', 'true');
        svg.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden';
        palco.appendChild(svg);
      }
      const glifo = (txt) => {
        const s = document.createElement('span');
        s.textContent = txt;
        Object.assign(s.style, { position: 'absolute', left: '50%', top: '0.3em', whiteSpace: 'pre', padding: `0 ${pad.toFixed(2)}px 0.08em`, backgroundRepeat: 'no-repeat', webkitBackgroundClip: 'text', backgroundClip: 'text', webkitTextFillColor: 'transparent', color: 'transparent' });
        return s;
      };
      const TAMBOR = 'linear-gradient(to bottom, transparent 0.1em, #000 0.44em, #000 1.24em, transparent 1.52em)';
      const cols = [], resto = [];
      let n = 0;
      letras.forEach((c, idx) => {
        const st = c.style;
        const item = { el: c, idx, x: 0, y: 0, w: 0, kern: 0 };
        if (!/\d/.test(c.textContent)) {
          Object.assign(st, { backgroundRepeat: 'no-repeat', webkitBackgroundClip: 'text', backgroundClip: 'text', webkitTextFillColor: 'transparent', color: 'transparent' });
          resto.push(item);
          return;
        }
        Object.assign(st, { position: 'relative', backgroundImage: 'none', padding: '0.3em', margin: '-0.3em', webkitMaskImage: TAMBOR, maskImage: TAMBOR });
        const alvo = +c.textContent;
        const id = `m-odo-${R.id}-${++contadorOdo}`;
        const f = document.createElementNS(NS, 'filter');
        f.setAttribute('id', id);
        f.setAttribute('x', '-20%');
        f.setAttribute('y', '-60%');
        f.setAttribute('width', '140%');
        f.setAttribute('height', '220%');
        const g = document.createElementNS(NS, 'feGaussianBlur');
        g.setAttribute('stdDeviation', '0 0');
        f.appendChild(g);
        svg.appendChild(f);
        cols.push(Object.assign(item, { alvo, passos: passos(n), i: n, borrao: g, filtro: `url(#${id})` }));
        n++;
      });
      // medidas (fonte já carregada no montar): largura de cada algarismo e o kerning do texto corrido
      const sonda = (txt) => {
        const q = document.createElement('span');
        Object.assign(q.style, { display: 'inline-block', whiteSpace: 'pre' });
        q.textContent = txt;
        el.appendChild(q);
        const w = pxCss(q, 'width');
        q.remove();
        return w;
      };
      const nr = el.getBoundingClientRect();
      let W = pxCss(el, 'width');
      const q = nr.width / W;
      const H = nr.height / q;
      const larg = [...'0123456789'].map((d) => sonda(d));
      const tambor = 0.3 * pxCss(el, 'fontSize');
      const fantasma = document.createElement('span');
      fantasma.textContent = texto;
      Object.assign(fantasma.style, { position: 'absolute', left: '0', top: '0', visibility: 'hidden', whiteSpace: 'pre', background: 'none' });
      el.appendChild(fantasma);
      const gr = fantasma.getBoundingClientRect();
      const range = document.createRange();
      const kern = [...texto].map((ch, i) => {
        range.setStart(fantasma.firstChild, i);
        range.setEnd(fantasma.firstChild, i + 1);
        return (range.getBoundingClientRect().left - gr.left) / q;
      });
      const Wk = gr.width / q;
      fantasma.remove();
      resto.concat(cols).forEach((c) => {
        const r = c.el.getBoundingClientRect();
        const ins = c.alvo !== undefined ? tambor : 0;
        const left = (r.left - nr.left) / q + ins;
        c.kern = kern[c.idx] + (W - Wk) / 2 - left;
        c.x = -kern[c.idx];
        c.y = -((r.top - nr.top) / q + ins);
        c.w = pxCss(c.el, 'width') - 2 * ins;
      });
      W = Wk;
      // o algarismo original da coluna vira um espaço invisível; os dois que rolam ficam por cima
      cols.forEach((c) => {
        const txt = c.el.firstChild;
        if (txt && txt.nodeType === 3) {
          const s = document.createElement('span');
          s.style.visibility = 'hidden';
          s.textContent = txt.textContent;
          txt.replaceWith(s);
        }
        c.a = glifo(String(c.alvo));
        c.b = glifo(String(c.alvo));
        c.el.appendChild(c.a);
        c.el.appendChild(c.b);
      });
      void k;
      return { el, cols, resto, W, H, larg, pad, largo: degradeLargo(imagem, W, H, 0.16) };
    }

    /** Odômetro no tempo t. A coluna i parte em inicio + i·cascata e trava em trava − (n−1−i)·passo;
        depois de travado o degradê deriva devagar (passa pelo aprovado em ref). brilho: [t0, t1] de
        um reflexo que atravessa os algarismos uma vez. oResto: opacidade do que não é algarismo. */
    function odometro(t, od, { inicio = 0, trava = 0.7, cascata = 0.03, passo = 0.1, brilho = null, deriva = 0.1, ref = api.ref, oResto = 1, cor = 'var(--brilho, #fff)' } = {}) {
      if (!od) return;
      const PASSO = 1.2; // em: distância entre algarismos no tambor
      const W = od.W;
      const gq = brilho ? prog(t, brilho[0], brilho[1]) : 0;
      const gx = gq > 0 && gq < 1 ? lerp(-0.25, 1.25, ease.inOutSine(gq)) * W : -2 * W;
      const L = gx - 1.5 * W;
      const rd = deriva * W * (deslize(t, trava, Math.max(trava + 0.01, ref), 0.5) - 1);
      const R0 = rd - od.largo.m * W;
      const img = `linear-gradient(100deg, transparent 43%, color-mix(in srgb, ${cor} 85%, transparent) 50%, transparent 57%), ${od.largo.img}`;
      const tam = `${(3 * W).toFixed(2)}px ${od.H.toFixed(2)}px, ${od.largo.W1.toFixed(2)}px ${od.H.toFixed(2)}px`;
      const pintar = (e, bx, by) => {
        e.style.backgroundImage = img;
        e.style.backgroundSize = tam;
        e.style.backgroundPosition = `${(L + bx).toFixed(2)}px ${by.toFixed(2)}px, ${(R0 + bx).toFixed(2)}px ${by.toFixed(2)}px`;
      };
      const u = api.pxPorCqw;
      od.resto.forEach((c) => {
        pintar(c.el, c.x, c.y);
        api.set(c.el, { pre: '', x: c.kern / u, o: oResto });
      });
      const n = od.cols.length;
      od.cols.forEach((c) => {
        const a0 = inicio + c.i * cascata, z = trava - (n - 1 - c.i) * passo;
        const P = (x) => c.passos * ease.outCubic(prog(x, a0, z));
        const p = P(t);
        const i0 = Math.floor(p + 1e-6);
        const fr = Math.max(0, p - i0);
        const dig = (j) => (((c.alvo - c.passos + j) % 10) + 10) % 10;
        const v = Math.abs(P(t + 0.004) - P(t - 0.004)) / 0.008;
        const por = (e, d, y, mostra) => {
          if (e.textContent !== String(d)) e.textContent = String(d);
          e.style.transform = `translate(-50%, ${y.toFixed(4)}em)`;
          e.style.opacity = mostra ? '1' : '0';
          pintar(e, c.x + (od.larg[d] - c.w) / 2 + od.pad, c.y);
        };
        por(c.a, dig(i0), -fr * PASSO, true);
        por(c.b, dig(i0 + 1), (1 - fr) * PASSO, fr > 0.0005);
        const sd = Math.min(16, v * 0.42);
        c.el.style.transform = `translateX(${c.kern.toFixed(3)}px)`;
        c.borrao.setAttribute('stdDeviation', `0 ${sd.toFixed(2)}`);
        c.el.style.filter = sd > 0.3 ? c.filtro : 'none';
      });
    }

    /* ─── frente de luz por trás do vidro ─────────────────────────────────────────────────────
       Um anel largo de luz sai de um ponto e atravessa uma grade (bento, mosaico) por trás do vidro;
       existe só dentro da caixa da grade (aparece nos vãos e através dos cards, nunca no vazio em
       volta). el: um span absoluto em left/top 0 dentro da grade. Medidas em px da grade. Use
       tempoDaFrente para acender cada card quando a frente alcança a borda mais próxima dele. */
    function tempoDaFrente(dist, { inicio = 0, fim = 0.95, raio = 1250 } = {}) {
      return inicio + (fim - inicio) * (1 - Math.sqrt(Math.max(0, 1 - dist / raio)));
    }
    function frenteDeLuz(el, t, { centro, caixa, raio = 1250, inicio = 0, fim = 0.95, banda = 240, cor = 'var(--luz-3)', nucleo = 'var(--brilho, #fff)', apagar = [0.42, 0.8], desfoque = '0.7cqw' } = {}) {
      if (!el || !centro || !caixa) return;
      const q = prog(t, inicio, fim);
      const Rr = raio * (1 - (1 - q) ** 2);
      const bw = Math.min(Rr, banda);
      const o = q <= 0 ? 0 : ease.outCubic(prog(t, inicio, inicio + 0.08)) * (1 - ease.inOutSine(prog(Rr, apagar[0] * raio, apagar[1] * raio)));
      const ci = [Rr - centro.y, centro.x + Rr - caixa.w, centro.y + Rr - caixa.h, Rr - centro.x].map((v) => Math.max(0, v).toFixed(1) + 'px');
      api.set(el, {
        pre: `translate(${(centro.x - Rr).toFixed(1)}px, ${(centro.y - Rr).toFixed(1)}px)`,
        o,
        clip: Rr < 1 ? 'none' : `inset(${ci.join(' ')})`,
        style: {
          width: `${(2 * Rr).toFixed(1)}px`,
          height: `${(2 * Rr).toFixed(1)}px`,
          borderRadius: '50%',
          mixBlendMode: 'screen',
          background: Rr < 1 ? 'none'
            : `radial-gradient(closest-side, transparent ${(Rr - bw).toFixed(1)}px, color-mix(in srgb, ${cor} 22%, transparent) ${(Rr - bw * 0.35).toFixed(1)}px, color-mix(in srgb, ${nucleo} 30%, transparent) ${(Rr - 10).toFixed(1)}px, transparent ${Rr.toFixed(1)}px)`,
          filter: `blur(${desfoque})`,
        },
      });
    }

    /* ─── a luz atrás do vidro (.m-vidro) ─────────────────────────────────────────────────────
       As duas manchas de luz do card (--x1 --y1 / --x2 --y2) circulam devagar em sentidos opostos e
       a intensidade (--mo) respira para BAIXO (nunca passa da aprovada), cada card no seu período;
       no quadro aprovado (ref) tudo está exatamente onde o CSS pôs. k: envelope da vida (0..1, entre
       com suave5); luz: acendimento do card (0..1); fator: multiplica a intensidade final. */
    function luzDoVidro(el, t, { k = 1, luz = 1, fator = 1, fase = 0, periodo = 3.6, ref = api.ref, raio = [6, 5, 5, 4], respira = 0.07 } = {}) {
      if (!el) return;
      if (!el.__mVidro) {
        const cs = getComputedStyle(el);
        const v = ['--x1', '--y1', '--x2', '--y2', '--mo'].map((p) => parseFloat(cs.getPropertyValue(p)));
        el.__mVidro = { x1: v[0], y1: v[1], x2: v[2], y2: v[3], mo: isNaN(v[4]) ? 0.7 : v[4] };
      }
      const g = el.__mVidro;
      const TAU = 2 * Math.PI;
      const a = (TAU * (t - ref)) / 4.6 + fase, b = (TAU * (t - ref)) / 5.4 - fase;
      if (!isNaN(g.x1) && !isNaN(g.y1)) {
        el.style.setProperty('--x1', `${(g.x1 + raio[0] * k * (Math.sin(a) - Math.sin(fase))).toFixed(3)}%`);
        el.style.setProperty('--y1', `${(g.y1 + raio[1] * k * (Math.cos(a) - Math.cos(fase))).toFixed(3)}%`);
      }
      if (!isNaN(g.x2) && !isNaN(g.y2)) {
        el.style.setProperty('--x2', `${(g.x2 - raio[2] * k * (Math.sin(b) + Math.sin(fase))).toFixed(3)}%`);
        el.style.setProperty('--y2', `${(g.y2 + raio[3] * k * (Math.cos(b) - Math.cos(fase))).toFixed(3)}%`);
      }
      const dip = 1 - respira * (1 - Math.cos((TAU * (t - ref)) / periodo));
      el.style.setProperty('--mo', (g.mo * luz * lerp(1, dip, k) * fator).toFixed(4));
    }

    Object.assign(api.fx, { degradeLargo, frenteDeLuz, tempoDaFrente, luzDoVidro });
    Object.assign(api.tipo, { escorrerDestaque, frenteDeLetras, prepararOdometro, odometro });
    void tw;
  });
})();

<script>/* midia.js — fotos, vídeos, SVG da marca e mockups.

   No render(c) da cena:
     c.foto('produto', { classe: 'hero', foco: '50% 30%' })  → <img> da pasta midia/ (ou marca/ativos/)
     c.fundo('textura')                                     → url("…") para usar em style
     c.video('gravacao-de-tela', { inicio: 1.2, velocidade: 1, loop: true })
                                                            → quadro a quadro, preso ao tempo local
     c.svg('logo', { classe: 'logo', viewBox: '0 0 120 40' })  → SVG inline (ids únicos por cópia), recortado na caixa
     c.svg('logo', { so: '.simbolo' })                      → só aquele grupo (o resto sai) e a caixa justa nele
     c.foto('sala', { plano: true, foco: '30% 40%' })       → foto de plano cheio, já com a sobra (classe .plano)
     c.midias()                                             → os nomes das fotos de midia/ (para montagens)
     c.ativo('simbolo')                                     → URL do arquivo
     c.mockup('celular', { tela: c.foto('app'), classe: 'aparelho' })
         tipos: celular · tablet · notebook · navegador · janela · cartao
   No quadro:
     api.midia.mockup(el, { rx, ry, r, s, x, y, z })        → pose 3D com sombra e reflexo coerentes */
(function () {
  'use strict';
  const MIDIA = window.MOTION_MIDIA || {};
  const SVG = window.MOTION_SVG || {};
  let copias = 0;

  const achar = (nome) => MIDIA[nome] || MIDIA[String(nome).replace(/\.[a-z0-9]+$/i, '')] || null;

  Motion.estenderC((c, ctx, R) => {
    const faltou = (nome, tipo) => {
      Motion.erro(R.id, 'render', null, `não achei ${tipo} "${nome}" em midia/ nem em marca/ativos/`);
      return `<div class="m-faltando">${c.esc(nome)}</div>`;
    };
    c.ativo = (nome) => {
      const m = achar(nome);
      return m ? m.url : '';
    };
    c.fundo = (nome) => {
      const m = achar(nome);
      return m ? `url("${m.url}")` : 'none';
    };
    c.foto = (nome, { classe = '', foco = '50% 50%', alt = '', plano = false } = {}) => {
      const m = achar(nome);
      if (!m) return faltou(nome, 'a foto');
      const tag = m.tipo === 'svg' && SVG[m.chave]
        ? c.svg(nome, { classe: `m-foto-svg ${classe}` })
        : `<img class="m-foto ${c.esc(classe)}" src="${m.url}" alt="${c.esc(alt)}" style="object-position:${c.esc(foco)}" draggable="false">`;
      return plano ? `<div class="plano">${tag}</div>` : tag;
    };
    /** Nomes das fotos (imagens) de midia/, em ordem alfabética. */
    c.midias = ({ tipos = ['imagem', 'svg'] } = {}) => {
      const vistos = new Set();
      return Object.values(MIDIA)
        .filter((m) => tipos.includes(m.tipo) && !m.url.includes('/ativos/') && !vistos.has(m.chave) && vistos.add(m.chave))
        .map((m) => m.chave)
        .sort();
    };
    c.video = (nome, { classe = '', inicio = 0, velocidade = 1, loop = true, foco = '50% 50%' } = {}) => {
      const m = achar(nome);
      if (!m || !m.quadros) return faltou(nome, 'o vídeo');
      const q = m.quadros;
      return `<img class="m-foto m-video ${c.esc(classe)}" src="${q.pasta}/${q.prefixo}${String(1).padStart(5, '0')}.${q.ext}" data-m-video="${c.esc(m.chave)}" data-inicio="${+inicio}" data-velocidade="${+velocidade}" data-loop="${loop ? 1 : 0}" style="object-position:${c.esc(foco)}" alt="" draggable="false">`;
    };
    c.svg = (nome, { classe = '', viewBox = null, so = null } = {}) => {
      const m = achar(nome);
      const fonte = m && SVG[m.chave];
      if (!fonte) return faltou(nome, 'o SVG');
      const n = ++copias;
      let s = fonte.replace(/<\?xml[^>]*>/g, '').replace(/<!DOCTYPE[^>]*>/gi, '');
      const ids = [...s.matchAll(/\bid="([^"]+)"/g)].map((x) => x[1]);
      for (const id of ids) {
        const novo = `${id}-c${n}`;
        const esc = id.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        s = s
          .replace(new RegExp(`\\bid="${esc}"`, 'g'), `id="${novo}"`)
          .replace(new RegExp(`url\\(#${esc}\\)`, 'g'), `url(#${novo})`)
          .replace(new RegExp(`href="#${esc}"`, 'g'), `href="#${novo}"`);
      }
      s = s.replace(/<svg\b([^>]*)>/, (all, attrs) => {
        let a = attrs.replace(/\s(width|height)="[^"]*"/g, '');
        if (viewBox) a = a.replace(/\sviewBox="[^"]*"/, '') + ` viewBox="${viewBox}"`;
        const extra = `m-svg${viewBox || so ? ' m-recorte' : ''} ${classe}`;
        if (/\sclass="/.test(a)) a = a.replace(/\sclass="([^"]*)"/, ` class="$1 ${extra}"`);
        else a += ` class="${extra}"`;
        if (so) a += ` data-m-so="${c.esc(so)}"${viewBox ? ' data-m-viewbox="1"' : ''}`;
        return `<svg${a}>`;
      });
      return s;
    };
    c.mockup = (tipo = 'celular', { tela = '', classe = '' } = {}) => {
      const reflexo = '<div class="m-mockup-reflexo"></div>';
      switch (tipo) {
        case 'celular':
          return `<div class="m-mockup m-celular ${classe}"><div class="m-mockup-corpo"><div class="m-mockup-tela">${tela}</div><div class="m-mockup-ilha"></div>${reflexo}</div></div>`;
        case 'tablet':
          return `<div class="m-mockup m-tablet ${classe}"><div class="m-mockup-corpo"><div class="m-mockup-tela">${tela}</div>${reflexo}</div></div>`;
        case 'notebook':
          return `<div class="m-mockup m-notebook ${classe}"><div class="m-mockup-corpo"><div class="m-mockup-tela">${tela}</div>${reflexo}</div><div class="m-mockup-base"></div></div>`;
        case 'navegador':
          return `<div class="m-mockup m-navegador ${classe}"><div class="m-mockup-corpo"><div class="m-mockup-barra"><i></i><i></i><i></i></div><div class="m-mockup-tela">${tela}</div>${reflexo}</div></div>`;
        case 'janela':
          return `<div class="m-mockup m-janela ${classe}"><div class="m-mockup-corpo"><div class="m-mockup-barra"></div><div class="m-mockup-tela">${tela}</div>${reflexo}</div></div>`;
        default:
          return `<div class="m-mockup m-cartao ${classe}"><div class="m-mockup-corpo"><div class="m-mockup-tela">${tela}</div>${reflexo}</div></div>`;
      }
    };
  });

  /* c.svg(nome, { so }): tira tudo que não é o grupo pedido e ajusta a caixa nele (antes do montar) */
  Motion.prepararMidia = function (R) {
    for (const svg of R.conteudo.querySelectorAll('svg[data-m-so]')) {
      const manter = [...svg.querySelectorAll(svg.dataset.mSo)];
      if (!manter.length) {
        Motion.erro(R.id, 'render', null, `c.svg: não achei "${svg.dataset.mSo}" dentro do SVG`);
        continue;
      }
      const fica = (n) => manter.some((k) => k === n || k.contains(n) || n.contains(k));
      const naoDesenha = /^(defs|mask|clippath|lineargradient|radialgradient|filter|pattern|symbol|style|title|desc|metadata)$/i;
      const podar = (pai) => {
        for (const n of [...pai.children]) {
          if (naoDesenha.test(n.tagName)) continue;
          if (!fica(n)) n.remove();
          else if (!manter.includes(n)) podar(n);
        }
      };
      podar(svg);
      if (!svg.dataset.mViewbox) {
        let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
        for (const k of manter) {
          try {
            const b = k.getBBox();
            x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.x + b.width); y1 = Math.max(y1, b.y + b.height);
          } catch (_) {
            /* sem caixa */
          }
        }
        if (Number.isFinite(x0) && x1 > x0) {
          const f = Math.max(x1 - x0, y1 - y0) * 0.04;
          svg.setAttribute('viewBox', `${(x0 - f).toFixed(2)} ${(y0 - f).toFixed(2)} ${(x1 - x0 + 2 * f).toFixed(2)} ${(y1 - y0 + 2 * f).toFixed(2)}`);
        }
      }
    }
  };

  Motion.estender((api) => {
    api.midia = {
      /** Pose 3D de um mockup: giro, inclinação, escala; a sombra e o reflexo acompanham. */
      mockup(el, { rx = 0, ry = 0, r = 0, s = 1, x = 0, y = 0, z = 0, persp = 160, o } = {}) {
        if (!el) return;
        api.set(el, { pre: '', persp, x, y, z, rx, ry, r, s, ...(o !== undefined ? { o } : {}) });
        el.style.setProperty('--m-sombra-x', `${(-ry * 0.08).toFixed(3)}cqw`);
        el.style.setProperty('--m-sombra-y', `${(1.2 + rx * 0.06).toFixed(3)}cqw`);
        el.style.setProperty('--m-reflexo', `${(50 + ry * 2.2 - rx * 0.8).toFixed(2)}%`);
      },
    };
  });

  /* vídeos: troca o quadro pelo tempo local e espera decodificar */
  Motion.midiaNoQuadro = function (R, tl, pend) {
    if (!R.__videos) R.__videos = [...R.secao.querySelectorAll('img[data-m-video]')];
    for (const img of R.__videos) {
      const m = MIDIA[img.dataset.mVideo];
      if (!m || !m.quadros) continue;
      const q = m.quadros;
      let i = Math.floor(((+img.dataset.inicio || 0) + tl * (+img.dataset.velocidade || 1)) * q.fps + 1e-6);
      if (img.dataset.loop === '1') i = ((i % q.n) + q.n) % q.n;
      else i = Math.max(0, Math.min(q.n - 1, i));
      const src = `${q.pasta}/${q.prefixo}${String(i + 1).padStart(5, '0')}.${q.ext}`;
      if (img.__mSrc !== src) {
        img.__mSrc = src;
        img.src = src;
        if (img.decode) pend.push(img.decode().catch(() => {}));
      }
    }
  };
})();

<script>/* transicoes.js — a biblioteca de transições entre cenas (o motor é dono delas).

   Cada transição escreve só nos invólucros: `.m-cena` (A.estilo: opacidade, desfoque, máscara)
   e `.m-camera` (A.posar: escala e posição da câmera do motor, origem no centro do quadro,
   p → s·p + (x, y) em cqw), mais as camadas do motor (Motion.camada('veu'), 'luz'), que ficam por
   cima de tudo e são zeradas a cada quadro. Assim a transição também é pura.

   modo 'sobreposta': as duas cenas tocam juntas; e.p vai de 0 a 1 na janela.
   modo 'encadeada': corte seco no meio; e.lado = 'A' com e.pA (0..1 até o corte) ou 'B' com e.pB.
   B pode ser null (saída final do filme). Uma transição própria do projeto vai em
   cenas/_transicoes.js com Motion.transicao('nome', { medir, preparar, aplicar }) e o modo/dur
   declarados no motion.json. */
(function () {
  'use strict';
  const TT = window.MotionTempo;
  const { clamp, lerp, prog, ease, suave, suave5, logLerp } = TT;
  const NS = 'http://www.w3.org/2000/svg';

  const selPonte = (nome) => `[data-ponte="${nome}"]`;
  const H = () => (Motion.ctx.formato.altura / Motion.ctx.formato.largura) * 100;
  const u = () => Motion.ctx.formato.largura / 100;

  /** Desfoque direcional na câmera do motor (obturador), σ em px. */
  function obturador(L, sx, sy) {
    const R = L.R;
    if (!R.__obt) {
      let svg = document.getElementById('m-fx-svg');
      if (!svg) {
        svg = document.createElementNS(NS, 'svg');
        svg.id = 'm-fx-svg';
        svg.setAttribute('width', '0');
        svg.setAttribute('height', '0');
        svg.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden';
        Motion.palco.appendChild(svg);
      }
      const f = document.createElementNS(NS, 'filter');
      f.id = `m-obt-cam-${R.id}`;
      f.setAttribute('x', '-20%');
      f.setAttribute('y', '-20%');
      f.setAttribute('width', '140%');
      f.setAttribute('height', '140%');
      f.setAttribute('color-interpolation-filters', 'sRGB');
      const g = document.createElementNS(NS, 'feGaussianBlur');
      f.appendChild(g);
      svg.appendChild(f);
      R.__obt = g;
    }
    const a = Math.round(Math.max(0, sx) * 4) / 4, b = Math.round(Math.max(0, sy) * 4) / 4;
    R.__obt.setAttribute('stdDeviation', `${a} ${b}`);
    if (a > 0 || b > 0) R.camera.style.filter = `url(#m-obt-cam-${R.id})`;
  }

  function veu(cor, o) {
    const v = Motion.camada('veu');
    v.style.cssText = `display:block;background:${cor};opacity:${clamp(o).toFixed(4)}`;
    return v;
  }

  const DIR = { esquerda: [-1, 0], direita: [1, 0], cima: [0, -1], baixo: [0, 1] };
  const DIR_TEXTO = { esquerda: 'a esquerda', direita: 'a direita', cima: 'cima', baixo: 'baixo' };

  /* ── corte ── */
  Motion.transicao('corte', { aplicar() {} });
  Motion.transicao('na-cena', { aplicar() {} });

  /* ── C1.1 + C1.2: corte seco no mesmo eixo, em movimento, com herança de velocidade ── */
  Motion.transicao('corte-no-eixo', {
    aplicar(e, A, B, op) {
      const forca = op.forca ?? 0.006, desf = op.desfoque ?? 0.42, K = op.K ?? 2.2, tau = op.tau ?? 0.17;
      const antes = op.__antes ?? 0.1, depois = op.__depois ?? 0.3;
      if (e.lado === 'A') {
        const g = (Math.pow(2, K * e.pA) - 1) / (Math.pow(2, K) - 1);
        A.posar({ s: 1 + forca * g });
        A.estilo({ blur: desf * g });
      } else if (B) {
        // velocidade de log-escala de A no último quadro, herdada por B e dissolvida devagar
        const vA = (forca * K * Math.LN2 * Math.pow(2, K)) / (Math.pow(2, K) - 1) / Math.max(0.01, antes) / (1 + forca);
        const D = Math.max(0.01, depois);
        const tB = e.pB * D;
        const ed = Math.exp(-D / tau);
        const a = vA * tau * (1 - ed);
        const f = (Math.exp(-tB / tau) - ed) / (1 - ed);
        B.posar({ s: Math.exp(-a * f) });
        B.estilo({ blur: desf * 0.6 * (1 - suave(tB / 0.09)) });
      }
    },
  });

  /* ── C1.4: avança, desfoca e apaga; a próxima nasce do desfoque no mesmo eixo ── */
  Motion.transicao('avancar-desfocar', {
    aplicar(e, A, B, op) {
      const av = op.avanco ?? 0.07, desf = op.desfoque ?? 0.8;
      if (e.lado === 'A') {
        const x = e.pA;
        A.posar({ s: 1 + av * ease.inCubic(x) });
        A.estilo({ blur: desf * x, o: 1 - x * x });
      } else if (B) {
        const x = ease.outCubic(e.pB);
        B.posar({ s: lerp(0.97, 1, x) });
        B.estilo({ blur: desf * (1 - x), o: suave(e.pB / 0.35) });
      }
    },
  });

  /* ── C1.8: véu uniforme, sem forma ── */
  Motion.transicao('esmaecer', {
    aplicar(e, A, B, op) {
      const cor = op.cor || 'var(--fundo)';
      if (!B) {
        veu(cor, ease.inOutSine(e.p));
        return;
      }
      if (e.p < 0.5) {
        B.estilo({ o: 0 });
        veu(cor, ease.inOutSine(e.p / 0.5));
      } else {
        A.estilo({ o: 0 });
        veu(cor, 1 - ease.inOutSine((e.p - 0.5) / 0.5));
      }
    },
  });

  /* ── crossfade ── */
  Motion.transicao('dissolver', {
    aplicar(e, A, B, op) {
      const x = ease.inOutSine(e.p);
      if (!B) {
        A.estilo({ o: 1 - x });
        return;
      }
      B.estilo({ o: x, blur: (op.desfoque || 0) * (1 - x) });
      if (op.escala) B.posar({ s: 1 + op.escala * (1 - x) });
    },
  });

  /* ── empurrar e chicote: B empurra A, com obturador direcional proporcional à velocidade ── */
  function empurrao(curva, fatorBlur, teto) {
    return {
      aplicar(e, A, B, op) {
        const d = DIR[op.direcao || 'esquerda'] || DIR.esquerda;
        const dist = d[0] ? 100 : H();
        const x = curva(e.p);
        const h = 0.004;
        const v = (Math.abs(curva(clamp(e.p + h)) - curva(clamp(e.p - h))) / (2 * h)) * dist / Math.max(0.05, op.__dur || 0.5);
        const sigma = Math.min(teto, v * fatorBlur * u());
        // a cena inteira anda (fundo junto): B entra colada em A, na mesma velocidade
        A.estilo({ x: d[0] * dist * x, y: d[1] * dist * x });
        obturador(A, d[0] ? sigma : 0, d[1] ? sigma : 0);
        if (B) {
          B.estilo({ x: -d[0] * dist * (1 - x), y: -d[1] * dist * (1 - x) });
          obturador(B, d[0] ? sigma : 0, d[1] ? sigma : 0);
        }
      },
    };
  }
  Motion.transicao('empurrar', empurrao(ease.inOutSine, 0.0028, 40));
  Motion.transicao('chicote', empurrao((p) => (p < 0.5 ? ease.inOutExpo(p) : 0.5 + 0.5 * ease.outExpo((p - 0.5) * 2)), 0.004, 90));

  /* ── C1.5: mergulho no elemento até ele virar o primeiro quadro da próxima ── */
  Motion.transicao('mergulho', {
    medir(op) {
      const m = [['A', op.alvo, 'fim']];
      if (op.ponte) m.push(['B', selPonte(op.ponte), 'inicio']);
      return m;
    },
    preparar(A, B, op, cache) {
      cache.a = op.alvo ? A.medida(op.alvo, 'fim') : null;
      cache.b = op.ponte && B ? B.medida(selPonte(op.ponte), 'inicio') : null;
      if (!cache.a) cache.a = { cx: 0, cy: 0, l: 40, a: 40 * 0.5625 };
    },
    aplicar(e, A, B, op, cache) {
      const a = cache.a, b = cache.b;
      const dur = op.__dur || 0.75;
      const fa = clamp((op.antecipacao ?? 0.2) / dur, 0, 0.6);
      const recuo = op.recuo ?? 0.025;
      const q = prog(e.p, 0, fa);
      const w = prog(e.p, fa * 0.55, 1);
      const ew = ease.mergulho(w);
      const sAnt = 1 - recuo * ease.inOutSine(q);
      const S1 = b ? b.l / a.l : (op.cobrir ?? 1.15) * Math.max(100 / a.l, H() / a.a);
      const S = sAnt * logLerp(1, S1 / (1 - recuo), ew);
      const dest = b ? [b.cx, b.cy] : [0, 0];
      const G = [lerp(a.cx, dest[0], ew), lerp(a.cy, dest[1], ew)];
      A.posar({ s: S, x: G[0] - S * a.cx, y: G[1] - S * a.cy });
      // no fim do mergulho A desfoca e apaga por baixo de B: o rastro rápido não vaza pela fusão
      A.estilo({ blur: 0.25 * ew * ew + 0.9 * suave(prog(e.p, 0.55, 1)), o: B ? 1 - suave(prog(e.p, 0.62, 0.96)) : 1 });
      // o resto escurece; o alvo fica aceso (véu com um buraco macio no alvo)
      const esc = (op.escurecer ?? 0.4) * suave(q) * (1 - suave(prog(w, 0.2, 0.7)));
      if (esc > 0.001) {
        const v = Motion.camada('veu');
        const px = u();
        const cx = (50 + G[0]) * px, cy = (H() / 2 + G[1]) * px;
        const rx = (S * a.l * 0.62 + 2) * px, ry = (S * a.a * 0.62 + 2) * px;
        const m = `radial-gradient(${rx.toFixed(1)}px ${ry.toFixed(1)}px at ${cx.toFixed(1)}px ${cy.toFixed(1)}px, transparent 55%, rgba(0,0,0,.6) 80%, #000 100%)`;
        v.style.cssText = `display:block;background:#000;opacity:${esc.toFixed(4)};-webkit-mask-image:${m};mask-image:${m}`;
      }
      if (!B) {
        veu('var(--fundo)', suave(prog(e.p, 0.7, 1)));
        return;
      }
      if (b) {
        // B preso ao alvo: a caixa-ponte de B coincide com o alvo na tela até assentar
        const sB = (S * a.l) / b.l;
        B.posar({ s: sB, x: G[0] - sB * b.cx, y: G[1] - sB * b.cy });
        B.estilo({ o: suave(prog(e.p, 0.55, 0.92)) });
      } else {
        const x = prog(e.p, 0.6, 1);
        B.posar({ s: lerp(1.06, 1, ease.outCubic(x)) });
        B.estilo({ o: suave(x / 0.8), blur: 0.5 * (1 - ease.outCubic(x)) });
      }
    },
  });

  /* ── C7: elemento compartilhado — a câmera leva o lugar dele numa cena até o lugar na outra ── */
  Motion.transicao('ponte', {
    medir(op) {
      return op.nome ? [['A', selPonte(op.nome), 'fim'], ['B', selPonte(op.nome), 'inicio']] : [];
    },
    preparar(A, B, op, cache) {
      cache.a = op.nome ? A.medida(selPonte(op.nome), 'fim') : null;
      cache.b = op.nome && B ? B.medida(selPonte(op.nome), 'inicio') : null;
      if (!cache.a || !cache.b) Motion.erro(A.id, 'transicao', null, `ponte: marque o mesmo data-ponte="${op.nome}" nas duas cenas`);
    },
    aplicar(e, A, B, op, cache) {
      const a = cache.a, b = cache.b;
      if (!a || !b || !B) return;
      const x = ease.simetrica(e.p);
      const arco = (op.arco || 0) * Math.sin(Math.PI * x);
      const dx = b.cx - a.cx, dy = b.cy - a.cy;
      const len = Math.hypot(dx, dy) || 1;
      const c = [lerp(a.cx, b.cx, x) - (dy / len) * arco, lerp(a.cy, b.cy, x) + (dx / len) * arco];
      const sA = logLerp(1, b.l / a.l, x);
      const sB = logLerp(a.l / b.l, 1, x);
      A.posar({ s: sA, x: c[0] - sA * a.cx, y: c[1] - sA * a.cy });
      B.posar({ s: sB, x: c[0] - sB * b.cx, y: c[1] - sB * b.cy });
      B.estilo({ o: ease.inOutSine(prog(e.p, 0.12, 0.88)) });
    },
  });

  /* ── C1.3: tudo converge num ponto e vira um ponto de luz macio ──
     A luz nasce no ponto exato (op.ponto, ou o centro do data-ponte da próxima). O brilho sobe só
     no conteúdo (o fundo da cena não clareia) e o que sai apaga antes de a convergência parar. */
  Motion.transicao('ponto-de-luz', {
    medir(op) {
      return op.ponte ? [['B', selPonte(op.ponte), 'inicio']] : [];
    },
    preparar(A, B, op, cache) {
      const b = op.ponte && B ? B.medida(selPonte(op.ponte), 'inicio') : null;
      cache.P = op.ponto || (b ? [b.cx, b.cy] : [0, 0]);
    },
    aplicar(e, A, B, op, cache) {
      const P = cache.P;
      const q = prog(e.p, 0, 0.62);
      const S = logLerp(1, 0.14, ease.inCubic(q));
      A.posar({ s: S, x: P[0] - S * P[0], y: P[1] - S * P[1] });
      A.estilo({ blur: 0.7 * q, oConteudo: 1 - suave(prog(q, 0.35, 0.85)), brilho: 1 + 1.3 * suave(q * 1.6) });
      // o ponto de luz: nasce enquanto tudo converge e apaga (ou vira o começo de B)
      const forca = suave(prog(e.p, 0.25, 0.6)) * (1 - suave(prog(e.p, 0.62, 0.98)));
      if (forca > 0.002) {
        const px = u();
        const diam = (6 + 10 * suave(prog(e.p, 0.2, 0.62))) * px;
        const cx = (50 + P[0]) * px, cy = (H() / 2 + P[1]) * px;
        const luz = Motion.camada('luz');
        const grad = A.api.fx.gradienteDeLuz(op.cor || 'var(--luz-1, var(--destaque, #fff))', 1, { forma: 'circle', ate: 50 });
        // inset:auto vem ANTES de left/top (depois, ele zeraria a posição e a luz iria para o canto)
        luz.style.cssText = `display:block;inset:auto;left:${(cx - diam / 2).toFixed(1)}px;top:${(cy - diam / 2).toFixed(1)}px;width:${diam.toFixed(1)}px;height:${diam.toFixed(1)}px;background:${grad};opacity:${forca.toFixed(4)};mix-blend-mode:plus-lighter`;
        luz.dataset.centro = `${cx.toFixed(1)},${cy.toFixed(1)}`;
      }
      if (B) B.estilo({ o: suave(prog(e.p, 0.58, 1)) });
    },
  });

  /* ── C1.6: a câmera atravessa a composição ── */
  Motion.transicao('atravessar', {
    aplicar(e, A, B, op) {
      const ate = op.ate ?? 4;
      const p = e.p;
      const S = Math.exp(Math.log(ate) * (0.3 * p + 0.7 * p * p));
      A.posar({ s: S });
      A.estilo({ blur: 0.9 * p * p, o: 1 - suave(prog(p, 0.5, 0.92)) });
      if (B) {
        const x = prog(p, 0.45, 1);
        B.posar({ s: lerp(0.95, 1, ease.outCubic(x)) });
        B.estilo({ o: suave(x / 0.7) });
      } else veu('var(--fundo)', suave(prog(p, 0.6, 1)));
    },
  });

  /* ── flash sem ataque seco ── */
  Motion.transicao('flash', {
    aplicar(e, A, B, op) {
      const cor = op.cor || 'var(--texto, #fff)';
      const forca = op.forca ?? 0.85;
      const o = e.lado === 'A' ? forca * suave(e.pA) : forca * (1 - ease.outCubic(e.pB));
      const v = Motion.camada('luz');
      v.style.cssText = `display:block;background:${cor};opacity:${clamp(o).toFixed(4)}`;
    },
  });

  /* ── lâmina de luz: luz que SOMA, larga e sem borda, varre o quadro; B aparece presa a ela ──
     O conteúdo de A apaga antes de a lâmina chegar (a lâmina nunca corta uma palavra ao meio). A luz
     é mais forte no primeiro terço do caminho e enfraquece ao atravessar: escolha o ângulo para ela
     chegar ao herói de B (rosto, produto) já fraca. angulo 100 = da esquerda para a direita;
     280 = da direita para a esquerda; 190 = de cima para baixo. */
  Motion.transicao('lamina-de-luz', {
    aplicar(e, A, B, op) {
      const ang = op.angulo ?? 100;
      const larg = op.largura ?? 16; // % do quadro: a meia-largura da luz
      const soft = op.suavidade ?? 16; // % do quadro: a borda da máscara de B
      const forca = op.forca ?? 0.42;
      const x = ease.inOutSine(e.p);
      const pos = lerp(-soft - larg, 100 + soft + larg, x);
      A.estilo({ oConteudo: 1 - suave(prog(e.p, 0.02, 0.32)) });
      if (B) {
        const ps = [];
        for (let i = 0; i <= 8; i++) {
          const k = i / 8;
          ps.push(`rgba(0,0,0,${(1 - suave5(k)).toFixed(4)}) ${(pos - soft + 2 * soft * k).toFixed(2)}%`);
        }
        B.estilo({ mask: `linear-gradient(${ang}deg, ${ps.join(', ')})` });
      }
      const cor = op.cor || 'var(--luz-1, var(--destaque, #fff))';
      const ps = [];
      for (let i = -10; i <= 10; i++) {
        const k = i / 10;
        const a = (Math.exp(-4.5 * k * k) - Math.exp(-4.5)) / (1 - Math.exp(-4.5)); // chega a zero liso na ponta
        ps.push(`color-mix(in srgb, ${cor} ${(a * 100).toFixed(1)}%, transparent) ${(pos + k * larg).toFixed(2)}%`);
      }
      const v = Motion.camada('luz');
      const o = forca * Math.pow(Math.sin(Math.PI * clamp(e.p)), 1.4) * (1 - 0.55 * x);
      v.style.cssText = `display:block;background:linear-gradient(${ang}deg, transparent ${(pos - larg * 1.05).toFixed(2)}%, ${ps.join(', ')}, transparent ${(pos + larg * 1.05).toFixed(2)}%);opacity:${o.toFixed(4)};mix-blend-mode:plus-lighter`;
    },
  });

  /* ── íris muito esfumada (desencorajada: prefira esmaecer) ── */
  Motion.transicao('iris', {
    aplicar(e, A, B, op) {
      if (!B) return;
      const P = op.ponto || [0, 0];
      const cx = 50 + P[0], cy = ((H() / 2 + P[1]) / H()) * 100;
      const raio = lerp(0, 160, ease.inOutCubic(e.p));
      const suav = Math.max(45, raio * 0.6);
      const ps = [];
      for (let i = 0; i <= 8; i++) {
        const x = i / 8;
        ps.push(`rgba(0,0,0,${(1 - suave5(x)).toFixed(4)}) ${(Math.max(0, raio - suav / 2) + suav * x).toFixed(2)}%`);
      }
      B.estilo({ mask: `radial-gradient(circle at ${cx.toFixed(2)}% ${cy.toFixed(2)}%, ${ps.join(', ')})` });
    },
  });
})();

<script>/* player.js — o player do filme no navegador (fora do modo captura).
   Teclas: espaço toca/pausa · ←/→ um quadro · Shift+←/→ um segundo · [ ] cena anterior/próxima ·
   L repete a cena · A área segura · F tela cheia. A prévia ao vivo pode perder quadros numa cena
   pesada: o MP4 renderizado é a verdade. */
(function () {
  'use strict';
  const params = new URLSearchParams(location.search);

  function fmt(t) {
    const m = Math.floor(t / 60);
    const s = t - m * 60;
    return `${String(m).padStart(2, '0')}:${s.toFixed(2).padStart(5, '0').replace('.', ',')}`;
  }

  function montar() {
    const L = Motion.linha;
    const palco = Motion.palco;
    document.body.classList.add('m-com-player');
    const moldura = document.createElement('div');
    moldura.id = 'm-moldura';
    palco.parentNode.insertBefore(moldura, palco);
    moldura.appendChild(palco);

    const barra = document.createElement('div');
    barra.id = 'm-player';
    barra.innerHTML = `
      <div class="m-regua"><div class="m-cenas"></div><div class="m-batidas"></div><input type="range" min="0" step="0.0001" value="0" aria-label="Tempo"><div class="m-cabeca"></div></div>
      <div class="m-controles">
        <button data-a="anterior" title="Cena anterior ([)">⏮</button>
        <button data-a="tocar" class="m-tocar" title="Tocar / pausar (espaço)">Tocar</button>
        <button data-a="proxima" title="Próxima cena (])">⏭</button>
        <span class="m-tempo"></span>
        <span class="m-cena-atual"></span>
        <span class="m-espaco"></span>
        <button data-a="repetir" title="Repetir a cena (L)">Repetir cena</button>
        <select data-a="velocidade" title="Velocidade"><option value="1">1×</option><option value="0.5">0,5×</option><option value="0.25">0,25×</option></select>
        <button data-a="seguro" title="Área segura (A)">Área segura</button>
        <button data-a="cheia" title="Tela cheia (F)">⤢</button>
      </div>`;
    document.body.appendChild(barra);

    const regua = barra.querySelector('.m-regua');
    const faixa = barra.querySelector('.m-cenas');
    const input = barra.querySelector('input');
    const cabeca = barra.querySelector('.m-cabeca');
    const lblTempo = barra.querySelector('.m-tempo');
    const lblCena = barra.querySelector('.m-cena-atual');
    const btTocar = barra.querySelector('.m-tocar');
    input.max = String(L.total);

    L.cenas.forEach((c, i) => {
      const d = document.createElement('div');
      d.className = 'm-cena-faixa';
      d.style.left = `${(c.inicio / L.total) * 100}%`;
      d.style.width = `${(c.dur / L.total) * 100}%`;
      d.innerHTML = `<span>${String(i + 1).padStart(2, '0')} ${c.titulo || c.id}</span>`;
      d.title = `${c.titulo || c.id} · ${fmt(c.inicio)}`;
      faixa.appendChild(d);
    });
    const bat = barra.querySelector('.m-batidas');
    const passo = 60 / (L.bpm || 120);
    for (let t = 0; t <= L.total + 1e-6; t += passo) {
      const b = document.createElement('i');
      b.style.left = `${(t / L.total) * 100}%`;
      bat.appendChild(b);
    }

    let tocando = false, t = 0, ultimo = 0, velocidade = 1, repetir = null, seguro = false;
    const ajustar = () => {
      const W = palco.offsetWidth, H = palco.offsetHeight;
      const altBarra = barra.offsetHeight + 16;
      const s = Math.min((innerWidth - 24) / W, (innerHeight - altBarra - 16) / H);
      palco.style.transform = `scale(${s})`;
      moldura.style.width = `${W * s}px`;
      moldura.style.height = `${H * s}px`;
    };
    ajustar();
    addEventListener('resize', ajustar);

    const cenaEm = (tt) => {
      let atual = L.cenas[0];
      for (const c of L.cenas) if (tt >= c.inicio - 1e-6) atual = c;
      return atual;
    };
    const mostrar = (tt) => {
      t = Math.max(0, Math.min(L.total, tt));
      Motion.ir(t);
      input.value = String(t);
      cabeca.style.left = `${(t / L.total) * 100}%`;
      const q = Math.round(t * L.fps);
      lblTempo.textContent = `${fmt(t)} · quadro ${q}`;
      const c = cenaEm(t);
      lblCena.textContent = `${String(L.cenas.indexOf(c) + 1).padStart(2, '0')} · ${c.titulo || c.id} · ${(t - c.inicio).toFixed(2).replace('.', ',')} s`;
    };
    const laco = (agora) => {
      if (!tocando) return;
      const dt = Math.min(0.1, (agora - ultimo) / 1000) * velocidade;
      ultimo = agora;
      let nt = t + dt;
      if (repetir) {
        if (nt >= repetir.inicio + repetir.dur) nt = repetir.inicio;
      } else if (nt > L.total) nt = 0;
      mostrar(nt);
      requestAnimationFrame(laco);
    };
    const alternar = () => {
      tocando = !tocando;
      btTocar.textContent = tocando ? 'Pausar' : 'Tocar';
      if (tocando) {
        ultimo = performance.now();
        requestAnimationFrame(laco);
      }
    };
    const pararE = (fn) => {
      tocando = false;
      btTocar.textContent = 'Tocar';
      fn();
    };
    const irCena = (dir) => {
      const i = L.cenas.indexOf(cenaEm(t + 1e-4));
      const alvo = L.cenas[Math.max(0, Math.min(L.cenas.length - 1, i + dir))];
      mostrar(alvo.inicio);
    };
    let caixaSeguro = null;
    const alternarSeguro = () => {
      seguro = !seguro;
      if (!caixaSeguro) {
        caixaSeguro = document.createElement('div');
        caixaSeguro.className = 'm-seguro';
        const f = Motion.FORMATOS[L.formato];
        caixaSeguro.style.left = `${f.seguro.x * 100}%`;
        caixaSeguro.style.right = `${f.seguro.x * 100}%`;
        caixaSeguro.style.top = `${f.seguro.topo * 100}%`;
        caixaSeguro.style.bottom = `${f.seguro.base * 100}%`;
        palco.appendChild(caixaSeguro);
      }
      caixaSeguro.style.display = seguro ? 'block' : 'none';
    };

    barra.addEventListener('click', (ev) => {
      const a = ev.target.closest('[data-a]')?.dataset.a;
      if (a === 'tocar') alternar();
      if (a === 'anterior') pararE(() => irCena(-1));
      if (a === 'proxima') pararE(() => irCena(1));
      if (a === 'repetir') {
        repetir = repetir ? null : cenaEm(t + 1e-4);
        ev.target.classList.toggle('m-ligado', !!repetir);
        if (repetir) mostrar(repetir.inicio);
      }
      if (a === 'seguro') {
        alternarSeguro();
        ev.target.classList.toggle('m-ligado', seguro);
      }
      if (a === 'cheia') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
    });
    barra.querySelector('select').addEventListener('change', (ev) => (velocidade = parseFloat(ev.target.value)));
    input.addEventListener('input', () => pararE(() => mostrar(parseFloat(input.value))));
    regua.addEventListener('dblclick', (ev) => {
      const c = ev.target.closest('.m-cena-faixa');
      if (c) pararE(() => mostrar(L.cenas[[...faixa.children].indexOf(c)].inicio));
    });
    addEventListener('keydown', (ev) => {
      if (ev.target.tagName === 'SELECT') return;
      const q = 1 / L.fps;
      if (ev.key === ' ') {
        ev.preventDefault();
        alternar();
      } else if (ev.key === 'ArrowRight') pararE(() => mostrar(t + (ev.shiftKey ? 1 : q)));
      else if (ev.key === 'ArrowLeft') pararE(() => mostrar(t - (ev.shiftKey ? 1 : q)));
      else if (ev.key === ']') pararE(() => irCena(1));
      else if (ev.key === '[') pararE(() => irCena(-1));
      else if (ev.key.toLowerCase() === 'l') barra.querySelector('[data-a="repetir"]').click();
      else if (ev.key.toLowerCase() === 'a') barra.querySelector('[data-a="seguro"]').click();
      else if (ev.key.toLowerCase() === 'f') barra.querySelector('[data-a="cheia"]').click();
    });

    mostrar(parseFloat((params.get('t') || '0').replace(',', '.')) || 0);
    if (params.has('play')) alternar();
    if (params.has('seguro')) alternarSeguro();
  }

  window.MotionPlayer = { montar };
})();

<script>/* _comum.js — a turma como bonecos de recorte.
   A ilustração foi separada em camadas (corpo e cabeça de cada pessoa, mais o braço de quem abraça
   e a mão no ombro), com as partes escondidas completadas por trás. Aqui mora o palco (fundo
   xadrez, moldura, estrelas, pessoas, flash), a coreografia inteira como função pura do tempo do
   filme e a câmera. As três cenas chamam Turma.aplicar(tGlobal): o estado é contínuo entre elas.

   Unidades: px da ilustração original (1055 × 1491). As camadas estão em 2× e moram num palco de
   2110 × 3760 (a ilustração no meio, com 389 px de sobra em cima e embaixo para o 9:16). */
(function () {
  const Z = 2, OY = 389, PW = 2110, PH = 3760;
  const CX = PW / 2, CY = OY + 1491; // centro da ilustração no palco
  const T_FLASH = 8.0;

  const CAMADAS = {"B1b": [72, 550, 522, 2024], "B2b": [444, 558, 456, 550], "B3b": [880, 598, 474, 578], "B4b": [1212, 602, 418, 456], "B5b": [1536, 568, 496, 1044], "B4a": [1704, 552, 190, 368], "B1h": [366, 334, 258, 302], "B2h": [656, 384, 258, 254], "B3h": [1024, 424, 220, 246], "B4h": [1256, 406, 246, 264], "B5h": [1474, 412, 240, 256], "M5b": [1444, 902, 446, 812], "M5h": [1366, 732, 496, 590], "M4b": [1054, 1004, 532, 1056], "M4h": [1132, 780, 350, 648], "M2b": [662, 912, 358, 1118], "M2h": [658, 770, 308, 382], "M1b": [176, 858, 556, 1202], "M1h": [302, 726, 406, 418], "M3b": [828, 1098, 330, 692], "M3h": [786, 876, 412, 522], "M6b": [1516, 1254, 524, 1244], "M6h": [1438, 1114, 258, 248], "F1b": [208, 1750, 608, 1046], "F3b": [1088, 1778, 818, 1044], "F2b": [520, 1812, 838, 1000], "F1h": [576, 1546, 226, 272], "F3h": [1104, 1630, 390, 278], "F2h": [876, 1586, 292, 304], "F1m": [764, 1802, 162, 216]};
  // a ordem de empilhamento (de trás para a frente) é a mesma em que as camadas foram completadas
  const ORDEM = Object.keys(CAMADAS);
  const ESTRELAS = [["estrela-02", 48, 421, 200, 214, 148, 529], ["estrela-00", 706, 389, 184, 182, 797, 480], ["estrela-01", 1230, 389, 176, 180, 1315, 477], ["estrela-03", 1860, 423, 202, 208, 1959, 528], ["estrela-05", 1936, 925, 158, 164, 2015, 1007], ["estrela-07", 1938, 1813, 152, 158, 2014, 1890], ["estrela-09", 1906, 2705, 182, 186, 1996, 2797], ["estrela-11", 1866, 3121, 198, 206, 1964, 3224], ["estrela-13", 1236, 3203, 160, 166, 1315, 3284], ["estrela-12", 718, 3197, 160, 168, 797, 3280], ["estrela-10", 40, 3121, 200, 208, 139, 3224], ["estrela-08", 26, 2685, 172, 178, 112, 2771], ["estrela-06", 20, 1813, 152, 156, 95, 1890], ["estrela-04", 20, 925, 156, 168, 97, 1008]]; // em volta, no sentido do relógio

  /* Pessoas: n = pescoço (pivô da cabeça), p = pé (pivô do corpo), par = para quem olha na conversa
     (+1 direita, -1 esquerda), risos = [início, duração] em s. */
  const P = {
    B1: { n: [230, 318], p: [190, 1240], fila: 'B', olha: [[0.3, 1, 0], [3.0, 1, 0]], risos: [[1.0, 0.95]] },
    B2: { n: [360, 318], p: [360, 1240], fila: 'B', olha: [[0.4, -1, 0], [2.7, 1, 0]], risos: [[1.05, 0.85]] },
    B3: { n: [562, 335], p: [560, 1240], fila: 'B', olha: [[0.5, 1, 0], [2.4, -1, 0]], risos: [[2.75, 0.6]] },
    B4: { n: [700, 338], p: [700, 1240], fila: 'B', olha: [[0.35, 1, 0]], risos: [[2.55, 0.85]], extra: ['B4a'] },
    B5: { n: [835, 335], p: [880, 1240], fila: 'B', olha: [[0.45, -1, 0]], risos: [[2.5, 0.95]] },
    M1: { n: [262, 480], p: [210, 1300], fila: 'M', olha: [[0.4, 1, 0]], risos: [[3.0, 0.75]] },
    M2: { n: [398, 492], p: [390, 1300], fila: 'M', olha: [[0.5, -1, 0], [2.3, 1, 0], [3.05, -1, 0]], risos: [[3.05, 0.8]] },
    M3: { n: [500, 560], p: [480, 1300], fila: 'M', olha: [[0.3, 1, 0], [2.4, -1, 0]], risos: [[1.5, 0.9]] },
    M4: { n: [612, 510], p: [650, 1300], fila: 'M', olha: [[0.45, -1, 0]], risos: [[1.55, 1.0]] },
    M5: { n: [765, 498], p: [790, 1300], fila: 'M', olha: [[0.35, 1, 1]], risos: [[1.25, 0.8]] },
    M6: { n: [835, 672], p: [880, 1250], fila: 'M', olha: [[0.5, -1, -1]], risos: [[1.3, 0.7]] },
    F1: { n: [335, 905], p: [220, 1385], fila: 'F', olha: [[0.4, 1, 0]], risos: [[2.1, 0.8]], extra: ['F1m'] },
    F2: { n: [505, 935], p: [450, 1385], fila: 'F', olha: [[0.5, -1, 0], [2.45, 1, 0]], risos: [[2.15, 0.9]] },
    F3: { n: [680, 955], p: [790, 1385], fila: 'F', olha: [[0.45, -1, 0]], risos: [[2.25, 0.75]] },
  };
  const NOMES = Object.keys(P);
  const DONO = {}; // camada → pessoa e parte
  for (const k of ORDEM) DONO[k] = { p: k.slice(0, 2), parte: k === 'B4a' || k === 'F1m' ? 'corpo' : k[2] === 'h' ? 'cabeca' : 'corpo' };

  /* ─── curvas: Hermite monotônica por chaves (velocidade contínua, sem passar do valor) ─── */
  function trilha(ch, t) {
    const n = ch.length;
    if (t <= ch[0][0]) return ch[0][1];
    if (t >= ch[n - 1][0]) return ch[n - 1][1];
    let i = 0;
    while (t > ch[i + 1][0]) i++;
    const [t0, p0] = ch[i], [t1, p1] = ch[i + 1];
    const tan = (j) => {
      if (j <= 0 || j >= n - 1) return 0;
      const a = (ch[j][1] - ch[j - 1][1]) / (ch[j][0] - ch[j - 1][0]);
      const b = (ch[j + 1][1] - ch[j][1]) / (ch[j + 1][0] - ch[j][0]);
      if (a * b <= 0) return 0;
      return (2 * a * b) / (a + b);
    };
    const d = t1 - t0, u = (t - t0) / d, u2 = u * u, u3 = u2 * u;
    return (2 * u3 - 3 * u2 + 1) * p0 + (u3 - 2 * u2 + u) * tan(i) * d + (-2 * u3 + 3 * u2) * p1 + (u3 - u2) * tan(i + 1) * d;
  }
  const r01 = (i, k) => { const x = Math.sin((i + 1) * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };
  const sinal = (v) => (v > 0 ? 1 : v < 0 ? -1 : 0);

  /* ─── a coreografia, montada uma vez em chaves ─── */
  const limpar = (ch) => { ch.sort((a, b) => a[0] - b[0]); for (let j = 1; j < ch.length; j++) if (ch[j][0] <= ch[j - 1][0] + 1e-3) ch[j][0] = ch[j - 1][0] + 0.02; return ch; };
  const COREO = {};
  NOMES.forEach((nome, i) => {
    const q = P[nome];
    const lado = q.n[0] - 527; // distância ao centro do grupo
    const dir = sinal(lado);
    const atraso = 0.08 + 0.42 * r01(i, 1);
    const dx0 = lado * 0.095 + (r01(i, 2) - 0.5) * 14;
    const dy0 = q.fila === 'F' ? -24 : q.fila === 'B' ? -5 : 3;
    const conversa = q.olha[0][1];
    const ap = -dir * (1.2 + 1.7 * Math.min(1, Math.abs(lado) / 420)); // "aperta": inclina para o centro
    const alt = i % 2 ? 1 : -1;
    const gotaF = q.fila === 'F' ? { F1: 5.0, F2: 5.125, F3: 5.25 }[nome] : 0;
    COREO[nome] = {
      x: [[0, dx0], [0.15 + atraso, dx0], [2.35 + atraso * 0.6, dx0 * 0.3], [3.9, dx0 * 0.24], [4.55, dx0 * 0.2], [5.2, -lado * 0.02], [6.15, -lado * 0.024], [6.6, lado * 0.008], [7.35, 0]],
      y: q.fila === 'F'
        ? [[0, dy0], [2.35, dy0 + 4], [gotaF - 0.06, dy0 + 2], [gotaF + 0.14, 4], [gotaF + 0.32, 0]]
        : [[0, dy0], [2.4 + atraso * 0.5, 0]],
      sy: q.fila === 'F'
        ? [[0, 1.025], [gotaF - 0.02, 1.025], [gotaF + 0.13, 0.962], [gotaF + 0.38, 1.0]]
        : [[0, 1], [1, 1]],
      r: [[0, 0], [0.6, 1.4 * conversa], [3.9, 1.1 * conversa], [4.6, 0], [5.45, ap * 0.35], [5.75, ap], [6.15, ap * 0.8], [6.45, -ap * 0.35], [6.95, -ap * 0.3], [7.4, 0]],
      // cabeça: yaw (+ vira para a direita), roll (+ inclina para a direita), pitch (- queixo para cima)
      yaw: (() => {
        const ch = [[0, 0]];
        q.olha.forEach(([t0, d], j) => { ch.push([t0, j ? q.olha[j - 1][1] * 22 : 0]); ch.push([t0 + 0.35, d * 22]); });
        const ripple = 3.85 + 0.035 * Math.abs(lado) / 40; // a chamada: viram para a câmera, do centro para fora
        ch.push([ripple, ch[ch.length - 1][1]], [ripple + 0.4, 0], [5.45, 0], [5.75, -dir * 12], [6.15, -dir * 10], [6.35, alt * 4], [6.6, alt * 9], [6.95, alt * 8], [7.3, 0]);
        return limpar(ch);
      })(),
      roll: (() => {
        const ch = [[0, 0]];
        q.olha.forEach(([t0, d, v], j) => { ch.push([t0, j ? q.olha[j - 1][1] * 6 : 0]); ch.push([t0 + 0.35, d * 6 + v * 4]); });
        const ripple = 3.85 + 0.035 * Math.abs(lado) / 40;
        ch.push([ripple, ch[ch.length - 1][1]], [ripple + 0.4, 0], [5.45, 0], [5.75, -dir * 9 - 3], [6.15, -dir * 7 - 2], [6.35, alt * 2], [6.6, alt * 7], [6.95, alt * 6], [7.32, 0]);
        return limpar(ch);
      })(),
      pitch: [[0, 0], [6.3, 0], [6.6, -7], [6.95, -6], [7.3, 0]],
      risos: q.risos,
      fase: r01(i, 3) * 6.28,
      fase2: r01(i, 4) * 6.28,
      passo: r01(i, 5),
    };
    if (q.olha[0][2]) COREO[nome].pitch = [[0, 0], [q.olha[0][0], 0], [q.olha[0][0] + 0.35, q.olha[0][2] * 5], [3.85, q.olha[0][2] * 5], [4.3, 0], [6.3, 0], [6.6, -7], [6.95, -6], [7.3, 0]];
  });

  /* Estado de uma pessoa no tempo do filme (congela no flash: a foto é tirada ali). */
  function estado(nome, t) {
    const c = COREO[nome];
    t = Math.min(t, T_FLASH);
    let x = trilha(c.x, t), y = trilha(c.y, t), r = trilha(c.r, t), sy = trilha(c.sy, t);
    let yaw = trilha(c.yaw, t), roll = trilha(c.roll, t), pitch = trilha(c.pitch, t), hy = 0;
    // andando: quica a cada passo e balança um fio, proporcional à velocidade
    const vel = Math.abs(trilha(c.x, t + 0.04) - trilha(c.x, t - 0.04)) / 0.08 + Math.abs(trilha(c.y, t + 0.04) - trilha(c.y, t - 0.04)) / 0.08 * (P[nome].fila === 'F' ? 0 : 1);
    const W = Math.min(1, vel / 55);
    const fp = 2.1 + 0.3 * c.passo;
    y -= 5 * W * (1 - Math.cos(2 * Math.PI * fp * t + c.fase)) / 2;
    r += 0.9 * W * Math.sin(Math.PI * fp * t + c.fase);
    // risada: ombros sacodem, a cabeça vai para trás, o corpo recua um fio
    for (const [t0, d] of c.risos) {
      const u = (t - t0) / d;
      if (u <= 0 || u >= 1) continue;
      const env = Math.pow(Math.sin(Math.PI * u), 1.3);
      y -= 3.2 * env * (1 - Math.cos(2 * Math.PI * 4.6 * (t - t0))) / 2;
      pitch -= 11 * env;
      hy -= 4 * env;
      roll += 3 * env * Math.sin(2 * Math.PI * 2.3 * (t - t0));
      r += -0.9 * env * sinal(P[nome].n[0] - 527 || 1);
    }
    // respiração e balanço leves (a vida no hold), até o clique
    sy *= 1 + 0.0042 * Math.sin((2 * Math.PI * t) / 3.1 + c.fase);
    r += 0.32 * Math.sin((2 * Math.PI * t) / 4.7 + c.fase2);
    roll += 0.6 * Math.sin((2 * Math.PI * t) / 3.7 + c.fase2);
    return { x, y, r, sy, yaw, roll, pitch, hy };
  }

  /* Câmera: nasce perto, nos rostos, e abre até a foto inteira no clique. */
  function camera(t) {
    if (t < T_FLASH) {
      const zoom = trilha([[0, 1.3], [2.6, 1.14], [4.5, 1.07], [6.6, 1.025], [T_FLASH, 1.0]], t);
      const fy = trilha([[0, 690], [3.0, 715], [5.5, 738], [T_FLASH, 745.5]], t);
      const fx = 527.5 + 8 * Math.sin((2 * Math.PI * t) / 6.5) * Math.min(1, (T_FLASH - t) / 2);
      return { zoom, fx, fy };
    }
    // a foto: push-in vivo, passando por 1,0 quando as estrelas assentam
    return { zoom: 1 + 0.0042 * (t - 10.9), fx: 527.5, fy: 745.5 };
  }

  const f = (v) => (Math.round(v * 1000) / 1000).toString();
  const PX = (x) => x * Z, PY = (y) => y * Z + OY; // ilustração → palco

  function render(c) {
    const img = (nome, x, y, w, h, cls, extra = '') =>
      `<img class="tc ${cls}" data-id="${nome}" src="${c.ativo(nome)}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform-origin:${-x}px ${-y}px" alt="" draggable="false"${extra}>`;
    const pessoas = ORDEM.map((k) => {
      const [x, y, w, h] = CAMADAS[k];
      return img(k, x, y + OY, w, h, 'pessoa');
    }).join('');
    const estrelas = ESTRELAS.map(([k, x, y, w, h]) => img(k, x, y, w, h, 'estrela')).join('');
    return `
      <div class="palco">
        <img class="fundo" src="${c.ativo('fundo')}" alt="" draggable="false">
        <div class="moldura-grupo">
          <img class="moldura" src="${c.ativo('moldura')}" alt="" draggable="false">
          ${estrelas}
        </div>
        <div class="turma">${pessoas}</div>
      </div>
      <div class="revela-cinza"></div>
      <div class="revela-branco"></div>
      <div class="brilho-foto"></div>
      <div class="flash"></div>`;
  }

  function montar(el, api) {
    el.palco = el.$('.palco');
    el.camadas = {};
    el.$$('.pessoa').forEach((im) => (el.camadas[im.dataset.id] = im));
    el.moldura = el.$('.moldura');
    el.estrelas = el.$$('.estrela').map((im, i) => ({ el: im, i, cx: ESTRELAS[i][5], cy: ESTRELAS[i][6] }));
    el.brilho = el.$('.brilho-foto');
    el.flash = el.$('.flash');
    el.cinza = el.$('.revela-cinza');
    el.branco = el.$('.revela-branco');
    el.k = api.largura / PW;
  }

  /* Aplica o filme inteiro no tempo global t. */
  function aplicar(t, el, api) {
    const { clamp, prog, ease, lerp } = api;
    // pessoas
    for (const nome of NOMES) {
      const q = P[nome], s = estado(nome, t);
      const px = PX(q.p[0]), py = PY(q.p[1]), nx = PX(q.n[0]), ny = PY(q.n[1]);
      const corpo = `translate(${f(s.x * Z)}px, ${f(s.y * Z)}px) translate(${f(px)}px, ${f(py)}px) rotate(${f(s.r)}deg) scale(1, ${f(s.sy)}) translate(${f(-px)}px, ${f(-py)}px)`;
      const cabeca = `${corpo} translate(${f(nx)}px, ${f(ny + s.hy * Z)}px) perspective(1400px) rotateY(${f(s.yaw)}deg) rotateX(${f(-s.pitch)}deg) rotate(${f(s.roll)}deg) translate(${f(-nx)}px, ${f(-ny)}px)`;
      api.set(el.camadas[`${nome}b`], { pre: corpo });
      api.set(el.camadas[`${nome}h`], { pre: cabeca });
      for (const e of q.extra || []) api.set(el.camadas[e], { pre: corpo });
    }
    // câmera
    const cam = camera(t), k = el.k * cam.zoom;
    const tx = api.largura / 2 - PX(cam.fx) * k, ty = api.altura / 2 - PY(cam.fy) * k;
    // o flash: estoura em 3 quadros e apaga; a foto nasce clara e revela a cor
    const tf = t - T_FLASH;
    const fl = tf < 0 ? 0 : tf < 0.05 ? ease.outCubic(tf / 0.05) : Math.exp(-(tf - 0.05) / 0.16);
    const rev = tf < 0 ? 0 : 1 - ease.outCubic(clamp((tf - 0.02) / 0.95));
    api.set(el.palco, { pre: `translate(${f(tx)}px, ${f(ty)}px) scale(${Math.round(k * 1e6) / 1e6})` });
    api.set(el.flash, { o: 0.96 * fl });
    api.set(el.branco, { o: 0.42 * rev });
    api.set(el.cinza, { o: 0.45 * rev });
    // a moldura chega de fora para dentro, elástica, e assenta (antes do clique ela não existe)
    const tm = t - (T_FLASH + 0.28);
    const ent = ease.inOutSine(clamp(tm / 0.14));
    const m = tm <= 0 ? 0 : ent * (1 - Math.exp(-6.2 * tm) * Math.cos(2 * Math.PI * 1.15 * tm));
    api.set(el.moldura, {
      pre: `translate(${CX}px, ${CY}px) scale(${f(1 + 0.32 * (1 - m))}, ${f(1 + 0.52 * (1 - m))}) translate(${-CX}px, ${-CY}px)`,
      o: t < T_FLASH ? 0 : 1,
    });
    // estrelas: uma a uma em volta, com mola; no hold giram e cintilam devagar
    for (const s of el.estrelas) {
      const t0 = T_FLASH + 1.0 + s.i * 0.045;
      const u = t - t0;
      const ab = clamp(u / 0.07);
      const sc = u <= 0 ? 0.5 : 1 - 0.5 * Math.exp(-7 * u) * Math.cos(2 * Math.PI * 1.7 * u);
      const vivo = Math.max(0, Math.min(1, (t - t0 - 0.5) / 1.2));
      const rot = (u <= 0 ? -70 : -70 * Math.exp(-6 * u) * Math.cos(2 * Math.PI * 0.9 * u)) + vivo * 7 * Math.sin((2 * Math.PI * (t - t0)) / (3.3 + 0.37 * (s.i % 4)) + s.i);
      const pul = 1 + vivo * 0.03 * Math.sin((2 * Math.PI * (t - t0)) / (2.1 + 0.29 * (s.i % 3)) + s.i * 1.7);
      api.set(s.el, {
        pre: `translate(${PX(0) + s.cx}px, ${s.cy}px) rotate(${f(rot)}deg) scale(${f(sc * pul)}) translate(${-s.cx}px, ${-s.cy}px)`,
        o: ab,
      });
    }
    // um brilho de papel fotográfico atravessa a foto uma vez
    const pb = prog(t, T_FLASH + 1.7, T_FLASH + 2.6);
    api.set(el.brilho, { x: lerp(-110, 110, ease.inOutSine(pb)), o: Math.sin(Math.PI * pb) * 0.8 });
  }

  window.Turma = { render, montar, aplicar, estado, camera, T_FLASH, P, COREO };
})();

//# sourceURL=cenas/_comum.js</script>

<script>/* chegada — "A turma chega"
   Ideia: Espalhados, conversando em duplas e trios, eles se juntam para a foto.
   A coreografia mora em _comum.js (Turma): a cena só aplica o tempo do filme, então o estado das
   pessoas, da câmera e da moldura atravessa as cenas sem costura. */
Motion.cena('chegada', {
  render: (c) => Turma.render(c),
  montar(el, api) { Turma.montar(el, api); },
  quadro(t, el, api) { Turma.aplicar(api.cena.inicio + t, el, api); },
});

//# sourceURL=cenas/chegada.js</script>
<script>/* poses — "As poses"
   Ideia: Viram para a câmera, se apertam, tentam uma pose, outra, e assentam na pose final.
   A coreografia mora em _comum.js (Turma): a cena só aplica o tempo do filme, então o estado das
   pessoas, da câmera e da moldura atravessa as cenas sem costura. */
Motion.cena('poses', {

});

//# sourceURL=cenas/poses.js</script>
<script>/* clique — "O clique"
   Ideia: O flash congela a turma; a foto revela a cor e a moldura chega com as estrelas.
   A coreografia mora em _comum.js (Turma): a cena só aplica o tempo do filme, então o estado das
