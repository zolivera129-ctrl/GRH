<!doctype html>
<html lang="pt-BR" data-formato="9x16">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>A foto da turma · 9:16</title>
<style>
/* ── marca/tokens.css (fontes embutidas) ── */
/* marca/tokens.css — as cores da ilustração da turma (lidas da arte original). */
:root {
  --fundo: #f36ea8;          /* rosa do xadrez */
  --moldura: #386d25;        /* verde da moldura ondulada */
  --estrela: #f4a31a;        /* laranja das estrelas */
  --texto: #fff6ee;
  --luz-flash: #ffffff;
  --cinza-revela: #8a8a8a;
  --fonte-titulo: ui-sans-serif, system-ui, sans-serif;
  --fonte-texto: ui-sans-serif, system-ui, sans-serif;
}

/* ── motor/base.css ── */
/* base.css — o palco, os invólucros do motor e utilitários neutros.
   Nenhuma cor própria: tudo vem de var(--…) da marca da pessoa (marca/tokens.css), com
   recuos neutros só para nada quebrar se um token faltar.

   Tokens que a marca preenche (obrigatórios): --fundo --texto --texto-suave --destaque
   --destaque-grad --luz-1 --luz-2 --luz-3 --fonte-titulo --fonte-texto --titulo-peso
   --titulo-tracking --titulo-entrelinha --raio
   Opcionais: --acao --acao-tinta --linha --vidro --vidro-borda --brilho --mockup-moldura
   --mockup-raio --mockup-sombra

   Unidades: tipografia em cqmin (o mesmo tamanho em px no 16:9 e no 9:16), posições em cqw/cqh.
   Para recompor o 9:16, escreva regras em [data-formato="9x16"] .cena-<id> … */

html, body { margin: 0; padding: 0; }
body { background: var(--fundo, #0b0b0c); overflow: hidden; }

#palco {
  position: relative;
  overflow: hidden;
  container-type: size;
  background: var(--fundo, #0b0b0c);
  color: var(--texto, #f2f2f2);
  font-family: var(--fonte-texto, system-ui, sans-serif);
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
  font-kerning: normal;
  transform-origin: 0 0;
}
#palco *, #palco *::before, #palco *::after {
  box-sizing: border-box;
  transition: none !important;
  caret-color: transparent;
}

/* ─── invólucros do motor ─── */
.m-cena {
  position: absolute;
  inset: 0;
  display: none;
  overflow: hidden;
  background: var(--fundo-cena, var(--fundo, #0b0b0c));
  isolation: isolate;
}
.m-cena.m-ativa, #palco.m-medindo .m-cena { display: block; }
.m-camera, .m-conteudo {
  position: absolute;
  inset: 0;
  transform-origin: 50% 50%;
}
.m-sobre {
  position: absolute;
  inset: 0;
  z-index: 1000;
  pointer-events: none;
}
/* Fundo puro (para blend na edição): a cor exata em todos os quadros, sem luz, grão nem vinheta. */
.m-cena.m-fundo-puro { background: var(--fundo, #000); }
.m-cena.m-fundo-puro .luz, .m-cena.m-fundo-puro .vinheta { display: none !important; }

/* ─── utilitários de composição ─── */
.camada { position: absolute; inset: 0; }
/* Plano cheio (foto, véu, degradê, textura de fundo): nasce com sobra de 6 % em cada borda.
   A câmera viva passa por escala < 1 antes do quadro aprovado; sem a sobra, a borda aparece. */
.plano { position: absolute; inset: calc(var(--sangria, 6%) * -1); }
.plano > .m-foto, .plano > .m-video, .plano > img { position: absolute; inset: 0; width: 100%; height: 100%; }
/* Véu de contraste por cima da foto (também sangrado). A cena escolhe o degradê. */
.veu { position: absolute; inset: calc(var(--sangria, 6%) * -1); pointer-events: none; }
.pilha {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.titulo {
  margin: 0;
  font-family: var(--fonte-titulo, var(--fonte-texto, system-ui, sans-serif));
  font-weight: var(--titulo-peso, 400);
  letter-spacing: var(--titulo-tracking, -0.02em);
  line-height: var(--titulo-entrelinha, 1.02);
  color: var(--texto, #f2f2f2);
}
.apoio {
  margin: 0;
  font-family: var(--fonte-texto, system-ui, sans-serif);
  color: var(--texto-suave, #a6a6a6);
}
.destaque {
  background-image: var(--destaque-grad, linear-gradient(90deg, var(--destaque, #fff), var(--destaque, #fff)));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
  padding-block: 0.1em;
  margin-block: -0.1em;
}
.m-destaque-dividido { padding-block: 0; margin-block: 0; }

/* Luz de fundo sem borda: duas fontes macias que a cena pode mover/respirar. Cada cena pode pôr as
   fontes em outro lugar (--luz-a-x/y, --luz-b-x/y, em % da caixa da luz, que sangra 25 %): variar a
   luz entre as cenas é o que impede o filme de parecer a mesma vinheta repetida. */
.luz {
  position: absolute;
  inset: -25%;
  pointer-events: none;
  background:
    radial-gradient(closest-side at var(--luz-a-x, 32%) var(--luz-a-y, 40%),
      color-mix(in srgb, var(--luz-1, #444) 55%, transparent) 0%,
      color-mix(in srgb, var(--luz-1, #444) 41%, transparent) 18%,
      color-mix(in srgb, var(--luz-1, #444) 25%, transparent) 36%,
      color-mix(in srgb, var(--luz-1, #444) 12%, transparent) 54%,
      color-mix(in srgb, var(--luz-1, #444) 4%, transparent) 72%,
      color-mix(in srgb, var(--luz-1, #444) 0.6%, transparent) 88%,
      transparent 100%),
    radial-gradient(closest-side at var(--luz-b-x, 70%) var(--luz-b-y, 64%),
      color-mix(in srgb, var(--luz-2, #333) 45%, transparent) 0%,
      color-mix(in srgb, var(--luz-2, #333) 33%, transparent) 18%,
      color-mix(in srgb, var(--luz-2, #333) 20%, transparent) 36%,
      color-mix(in srgb, var(--luz-2, #333) 9%, transparent) 54%,
      color-mix(in srgb, var(--luz-2, #333) 3%, transparent) 72%,
      color-mix(in srgb, var(--luz-2, #333) 0.4%, transparent) 88%,
      transparent 100%);
}

/* ─── texto dividido ─── */
.m-palavra { white-space: nowrap; }
.m-letra, .m-bloco {
  display: inline-block;
  white-space: pre;
  padding-block: 0.1em;
  margin-block: -0.1em;
  transform-origin: 50% 62%;
}
.m-linha { display: block; }
.m-linha-in { display: inline-block; transform-origin: 50% 60%; }
.m-linha.m-mascara { overflow: clip; padding-block: 0.16em; margin-block: -0.16em; }

/* Brilho que atravessa a palavra: cópia do glifo somada (plus-lighter), vista por uma faixa. */
.m-brilho { position: relative; }
.m-brilho::after {
  content: attr(data-m-ch);
  position: absolute;
  inset: -0.3em -0.2em;
  padding: 0.4em 0.2em 0.3em;
  white-space: pre;
  pointer-events: none;
  background: none;
  color: var(--m-brilho-tinta, rgba(255, 255, 255, 0.5));
  -webkit-text-fill-color: var(--m-brilho-tinta, rgba(255, 255, 255, 0.5));
  mix-blend-mode: plus-lighter;
  --m-faixa: linear-gradient(var(--m-brilho-angulo, 104deg),
    transparent calc(50% - var(--m-brilho-meia, 1cqw)),
    rgba(0, 0, 0, 0.1) calc(50% - var(--m-brilho-meia, 1cqw) * 0.86),
    rgba(0, 0, 0, 0.5) calc(50% - var(--m-brilho-meia, 1cqw) * 0.72),
    rgba(0, 0, 0, 0.9) calc(50% - var(--m-brilho-meia, 1cqw) * 0.58),
    #000 calc(50% - var(--m-brilho-nucleo, 0.75cqw)),
    #000 calc(50% + var(--m-brilho-nucleo, 0.75cqw)),
    rgba(0, 0, 0, 0.9) calc(50% + var(--m-brilho-meia, 1cqw) * 0.58),
    rgba(0, 0, 0, 0.5) calc(50% + var(--m-brilho-meia, 1cqw) * 0.72),
    rgba(0, 0, 0, 0.1) calc(50% + var(--m-brilho-meia, 1cqw) * 0.86),
    transparent calc(50% + var(--m-brilho-meia, 1cqw)));
  -webkit-mask-image: var(--m-faixa);
  mask-image: var(--m-faixa);
  -webkit-mask-size: var(--m-brilho-caixa, 8cqw) 100%;
  mask-size: var(--m-brilho-caixa, 8cqw) 100%;
  -webkit-mask-repeat: no-repeat;
  mask-repeat: no-repeat;
  -webkit-mask-position: var(--m-brilho-x, -400cqw) 0;
  mask-position: var(--m-brilho-x, -400cqw) 0;
}

.m-cursor {
  display: inline-block;
  width: 0.08em;
  height: 1em;
  margin-left: 0.04em;
  vertical-align: -0.12em;
  background: currentColor;
}
.numero { font-variant-numeric: tabular-nums; }

/* ─── mídia ─── */
.m-foto { display: block; width: 100%; height: 100%; object-fit: cover; user-select: none; }
.m-svg { display: block; width: 100%; height: auto; overflow: visible; }
/* c.svg(nome, { viewBox }) ou { so: '.simbolo' }: só o recorte aparece, nada vaza da caixa */
.m-svg.m-recorte { overflow: hidden; }
.m-faltando {
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
  min-height: 4cqmin;
  outline: 0.3cqmin dashed color-mix(in srgb, var(--texto, #fff) 40%, transparent);
  color: var(--texto-suave, #999);
  font: 1.6cqmin/1.2 system-ui, sans-serif;
}

/* ─── mockups (aparelhos em CSS; a tela é qualquer HTML) ─── */
.m-mockup {
  position: relative;
  --m-moldura: var(--mockup-moldura, #0d0e10);
  --m-raio: var(--mockup-raio, 3.4cqmin);
  --m-sombra-cor: var(--mockup-sombra, #000);
  transform-origin: 50% 50%;
}
.m-mockup-corpo {
  position: relative;
  width: 100%;
  height: 100%;
  background: var(--m-moldura);
  border-radius: var(--m-raio);
  box-shadow:
    var(--m-sombra-x, 0cqw) var(--m-sombra-y, 1.2cqw) 4.5cqw color-mix(in srgb, var(--m-sombra-cor) 42%, transparent),
    var(--m-sombra-x, 0cqw) calc(var(--m-sombra-y, 1.2cqw) * 0.3) 1.2cqw color-mix(in srgb, var(--m-sombra-cor) 30%, transparent),
    inset 0 0 0 0.12cqmin color-mix(in srgb, #fff 9%, transparent);
}
.m-mockup-tela {
  position: absolute;
  overflow: hidden;
  background: var(--fundo, #000);
}
.m-mockup-reflexo {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background: linear-gradient(115deg,
    transparent calc(var(--m-reflexo, 30%) - 22%),
    color-mix(in srgb, #fff 3%, transparent) calc(var(--m-reflexo, 30%) - 10%),
    color-mix(in srgb, #fff 8%, transparent) var(--m-reflexo, 30%),
    color-mix(in srgb, #fff 3%, transparent) calc(var(--m-reflexo, 30%) + 10%),
    transparent calc(var(--m-reflexo, 30%) + 22%));
  mix-blend-mode: plus-lighter;
}
.m-celular { width: 30cqmin; aspect-ratio: 9 / 19.5; }
.m-celular .m-mockup-tela { inset: 1.1cqmin; border-radius: calc(var(--m-raio) - 1cqmin); }
.m-celular .m-mockup-ilha {
  position: absolute;
  top: 2.2cqmin;
  left: 50%;
  width: 26%;
  height: 2.6%;
  translate: -50% 0;
  border-radius: 9cqmin;
  background: var(--m-moldura);
}
.m-tablet { width: 56cqmin; aspect-ratio: 3 / 4; }
.m-tablet .m-mockup-tela { inset: 2cqmin; border-radius: calc(var(--m-raio) - 1.6cqmin); }
.m-notebook { width: 92cqmin; }
.m-notebook .m-mockup-corpo { aspect-ratio: 16 / 10.2; height: auto; border-radius: 2.2cqmin 2.2cqmin 0.6cqmin 0.6cqmin; }
.m-notebook .m-mockup-tela { inset: 2.2cqmin 2.2cqmin 3.2cqmin; border-radius: 0.6cqmin; }
.m-notebook .m-mockup-base {
  position: relative;
  width: 112%;
  margin-left: -6%;
  height: 2.4cqmin;
  border-radius: 0 0 2.4cqmin 2.4cqmin;
  background: linear-gradient(180deg, color-mix(in srgb, var(--m-moldura) 80%, #fff) 0%, var(--m-moldura) 70%);
}
.m-navegador, .m-janela { width: 100cqmin; aspect-ratio: 16 / 10.4; }
.m-navegador .m-mockup-corpo, .m-janela .m-mockup-corpo { border-radius: 1.6cqmin; overflow: hidden; }
.m-navegador .m-mockup-barra, .m-janela .m-mockup-barra {
  position: absolute;
  inset: 0 0 auto;
  height: 4.2cqmin;
  display: flex;
  align-items: center;
  gap: 0.9cqmin;
  padding-left: 1.8cqmin;
}
.m-navegador .m-mockup-barra i {
  width: 1.1cqmin;
  height: 1.1cqmin;
  border-radius: 50%;
  background: color-mix(in srgb, #fff 18%, transparent);
}
.m-navegador .m-mockup-tela, .m-janela .m-mockup-tela { inset: 4.2cqmin 0 0; }
.m-cartao { width: 40cqmin; aspect-ratio: 4 / 5; }
.m-cartao .m-mockup-tela { inset: 0; border-radius: var(--m-raio); }

/* ─── conferência de contraste (o storyboard esconde os textos para medir o fundo) ─── */
.m-sem-texto [data-m-medido] { visibility: hidden !important; }

/* ─── área segura (o player e a inspeção desenham por cima) ─── */
.m-seguro {
  position: absolute;
  z-index: 2000;
  pointer-events: none;
  outline: 2px dashed rgba(255, 64, 64, 0.85);
  outline-offset: -1px;
}

/* ─── erros na prévia ─── */
#m-erros {
  position: fixed;
  left: 12px;
  top: 12px;
  z-index: 9999;
  max-width: min(560px, calc(100vw - 24px));
  display: flex;
  flex-direction: column;
  gap: 6px;
  font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace;
}
#m-erros:empty { display: none; }
#m-erros > div { padding: 8px 10px; border-radius: 8px; background: #b3261e; color: #fff; }
html.m-captura #m-erros { display: none; }

/* nivel.css — materiais de "nível de filme" (ver motor/nivel.js). Só tokens da marca, com recuos
   neutros. Tokens opcionais que a marca pode preencher: --vidro --vidro-reflexo --vidro-borda
   --cartao-forte --cartao-heroi --raio.

   .m-vidro        vidro escuro fosco sobre luz: deixa passar a luz de trás (backdrop), tem a sua
                   própria luz atrás (duas manchas: --x1 --y1 --c1 e --x2 --y2 --c2, intensidade
                   --mo) e um fio de borda claro em cima e na ponta (--vidro-borda, opacidade --borda).
                   Uma família só: todos os cards iguais, muda só a cor da luz de cada um.
   .m-vidro-forte  o card de destaque: a cor da marca como superfície (sem vidro).
   .m-vidro-heroi  o protagonista: luz da marca de dentro para fora. */
.m-vidro {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  border-radius: var(--raio, 1.6cqw);
  background:
    var(--vidro-reflexo, linear-gradient(158deg, color-mix(in srgb, #fff 9%, transparent) 0%, color-mix(in srgb, #fff 2%, transparent) 28%, transparent 46%)),
    var(--vidro, linear-gradient(color-mix(in srgb, #0a0c10 62%, transparent), color-mix(in srgb, #050608 74%, transparent)));
  -webkit-backdrop-filter: blur(2.2cqw) saturate(1.35);
  backdrop-filter: blur(2.2cqw) saturate(1.35);
}
.m-vidro::before {
  content: '';
  position: absolute;
  inset: -15%;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(circle at var(--x1, 50%) var(--y1, 100%), var(--c1, transparent) 0%, transparent 46%),
    radial-gradient(circle at var(--x2, 50%) var(--y2, 50%), var(--c2, transparent) 0%, transparent 40%);
  filter: blur(2cqw) saturate(0.7);
  opacity: var(--mo, 0.7);
}
.m-vidro::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  pointer-events: none;
  background: var(--vidro-borda, linear-gradient(145deg, color-mix(in srgb, #fff 36%, transparent), color-mix(in srgb, #fff 6%, transparent) 36%, color-mix(in srgb, #fff 4%, transparent) 64%, color-mix(in srgb, #fff 24%, transparent)));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  opacity: var(--borda, 1);
}
.m-vidro-forte {
  background: var(--cartao-forte, radial-gradient(ellipse 95% 85% at 85% 0%, var(--destaque, #ccc) 0%, color-mix(in srgb, var(--destaque, #ccc) 55%, var(--fundo, #000)) 40%, var(--fundo, #000) 100%));
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
}
.m-vidro-forte::before { display: none; }
.m-vidro-heroi {
  background: var(--cartao-heroi, radial-gradient(ellipse 85% 70% at 50% 38%, var(--luz-1, #333) 0%, color-mix(in srgb, var(--luz-1, #333) 50%, var(--fundo, #000)) 40%, var(--fundo, #000) 100%));
}

/* player.css — só aparece fora do modo captura. Paleta neutra própria (não é a marca). */
body.m-com-player {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  background: #111214;
  padding-top: 12px;
  box-sizing: border-box;
}
#m-moldura { position: relative; overflow: hidden; border-radius: 10px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45); }
#m-moldura #palco { position: absolute; left: 0; top: 0; }
#m-player {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: 12px;
  z-index: 50;
  padding: 10px 12px 8px;
  border-radius: 12px;
  background: rgba(24, 25, 28, 0.94);
  color: #e9eaee;
  font: 12px/1.3 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-variant-numeric: tabular-nums;
  box-shadow: 0 6px 30px rgba(0, 0, 0, 0.4);
  -webkit-font-smoothing: antialiased;
}
#m-player .m-regua { position: relative; height: 34px; margin-bottom: 8px; }
#m-player .m-cenas { position: absolute; inset: 0 0 10px; }
#m-player .m-cena-faixa {
  position: absolute;
  top: 0;
  bottom: 0;
  border-left: 1px solid rgba(255, 255, 255, 0.22);
  background: rgba(255, 255, 255, 0.05);
  overflow: hidden;
}
#m-player .m-cena-faixa:nth-child(even) { background: rgba(255, 255, 255, 0.08); }
#m-player .m-cena-faixa span { display: block; padding: 5px 6px; white-space: nowrap; color: #b9bcc4; font-size: 11px; }
#m-player .m-batidas { position: absolute; left: 0; right: 0; bottom: 4px; height: 6px; }
#m-player .m-batidas i { position: absolute; bottom: 0; width: 1px; height: 6px; background: rgba(255, 255, 255, 0.25); }
#m-player input[type='range'] { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
#m-player .m-cabeca { position: absolute; top: -2px; bottom: -2px; width: 2px; margin-left: -1px; background: #fff; pointer-events: none; }
#m-player .m-controles { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
#m-player button, #m-player select {
  height: 28px;
  padding: 0 10px;
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 999px;
  background: transparent;
  color: inherit;
  font: inherit;
  cursor: pointer;
}
#m-player button:hover { background: rgba(255, 255, 255, 0.08); }
#m-player button.m-ligado { background: #e9eaee; color: #111214; }
#m-player .m-tocar { min-width: 72px; }
#m-player .m-tempo { margin-left: 8px; color: #fff; }
#m-player .m-cena-atual { color: #9a9ea8; }
#m-player .m-espaco { flex: 1; }

/* ── cenas/_comum.css ── */
/* _comum.css — o palco da turma (ver _comum.js). O palco tem o tamanho das camadas (2110 × 3760 px)
   e é posto no quadro pela câmera; tudo dentro dele está em px da arte em 2×. */
.palco { position: absolute; left: 0; top: 0; width: 2110px; height: 3760px; transform-origin: 0 0; }
.palco .fundo, .palco .moldura { position: absolute; left: 0; top: 0; width: 2110px; height: 3760px; display: block; }
.palco .moldura { transform-origin: 0 0; box-shadow: 0 0 0 900px var(--moldura); }
.palco .moldura-grupo, .palco .turma { position: absolute; inset: 0; }
.palco .tc { position: absolute; display: block; max-width: none; user-select: none; }
.palco .estrela { opacity: 0; }
.flash, .revela-branco, .revela-cinza, .brilho-foto { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
.flash { background: var(--luz-flash); }
.revela-branco { background: var(--luz-flash); mix-blend-mode: screen; }

<script>/* tempo.js — tempo e curvas do motor (sem DOM).

      const pai = n.parentElement;
      const bloco = pai.closest('h1,h2,h3,h4,h5,p,li,.titulo,.apoio,.frase,[data-texto]') || pai;
      if (!R.conteudo.contains(bloco)) continue;
      const o = opacidadeEfetiva(pai);
      const atual = blocos.get(bloco) || { o: 0, cores: [], n: 0 };
      atual.o = Math.max(atual.o, o);
      if (o > 0.3) atual.cores.push(corDoTexto(pai));
      blocos.set(bloco, atual);
    }
    const textos = [];
    for (const [el, info] of blocos) {
      const r = el.getBoundingClientRect();
      const c = recorte(r);
      if (!c || info.o < 0.3) continue;
      const fs = parseFloat(getComputedStyle(el).fontSize) || 16;
      const escala = el.offsetWidth > 0 ? r.width / el.offsetWidth : 1;
      el.setAttribute('data-m-medido', '');
      const cor = info.cores.length ? [0, 1, 2].map((k) => info.cores.reduce((s, x) => s + x[k], 0) / info.cores.length) : [255, 255, 255];
      textos.push({ texto: el.textContent.replace(/\s+/g, ' ').trim().slice(0, 60), cqmin: Math.round(((fs * escala) / um) * 10) / 10, caixa: c, cor, o: Math.round(info.o * 100) / 100 });
    }
    // visuais (o herói): imagem, SVG, vídeo, mockup, [data-heroi] e caixas com fundo; planos cheios não contam
    const visuais = [];
    for (const el of R.conteudo.querySelectorAll('img, svg, video, .m-mockup, [data-heroi], div, span')) {
      if (el.closest('.luz, [data-m-medido]') || (el.tagName.toLowerCase() !== 'svg' && el.closest('svg'))) continue;
      const tag = el.tagName.toLowerCase();
      if ((tag === 'div' || tag === 'span') && !el.hasAttribute('data-heroi') && !el.classList.contains('m-mockup') && !pintaAlgo(el)) continue;
      const c = recorte(el.getBoundingClientRect());
      if (!c) continue;
      const area = (c.l * c.a) / (W * H);
      if (area < 0.01 || area > 0.92 || opacidadeEfetiva(el) < 0.3) continue;
      visuais.push({ area, heroi: el.hasAttribute('data-heroi'), caixa: c });
    }
    const maior = visuais.reduce((m, v) => Math.max(m, v.area), 0);
    const declarado = visuais.filter((v) => v.heroi).reduce((m, v) => Math.max(m, v.area), 0);
    // fotos: ampliação real (px na tela ÷ px do arquivo), com o enquadramento cover
    const fotos = [];
    for (const img of R.conteudo.querySelectorAll('img.m-foto')) {
      if (!img.naturalWidth || opacidadeEfetiva(img) < 0.3) continue;
      const r = img.getBoundingClientRect();
      if (!recorte(r)) continue;
      const fit = getComputedStyle(img).objectFit;
      const ex = r.width / img.naturalWidth, ey = r.height / img.naturalHeight;
      const escala = fit === 'contain' ? Math.min(ex, ey) : Math.max(ex, ey);
      fotos.push({ arquivo: decodeURIComponent((img.getAttribute('src') || '').split('/').pop() || ''), escala: Math.round(escala * 100) / 100, natural: [img.naturalWidth, img.naturalHeight] });
    }
    return { largura: W, altura: H, textos, heroi: Math.round(Math.max(maior, declarado) * 1000) / 1000, fotos };
  }
  Motion.medirComposicao = medirComposicao;

  /* ─── o que os scripts da skill usam ─── */
  window.__MOTION__ = {
    versao: Motion.versao,
    get pronto() {
      return Motion.pronto;
    },
    erros: () => erros.slice(),
    linha: () => Motion.linha,
    ir: async (t) => {
      const p = Motion.ir(t);
      if (p) await p;
      return true;
    },
    irCena: async (id, tl) => {
      const p = Motion.irCena(id, tl);
      if (p) await p;
      return true;
    },
    cenas: () =>
      Motion.cenaR.map((R) => ({
        id: R.id,
        inicio: R.inicio,
        dur: R.dur,
        temQuadro: typeof R.def.quadro === 'function',
        poses: Object.keys(R.def.poses || {}),
      })),
    pontes: () => Object.fromEntries(Motion.cenaR.map((R) => [R.id, R.pontes])),
    medirComposicao: (id) => medirComposicao(id),
    /** Esconde (ou mostra de novo) os textos medidos da cena: o fundo por baixo deles, para o contraste. */
    esconderTextos: (id, sim) => {
      const R = Motion.cenaPorId[id];
      if (R) R.secao.classList.toggle('m-sem-texto', !!sim);
      return true;
    },
  };

  Motion.interno = { posarCamera, estilizarCena, caixaTela, caixaLayout, criarSet, zerarInvolucros };
})();

<script>/* camera.js — a câmera da cena (api.camera).

   const cam = api.camera({
     alvo: el.$('.mundo'),             // o que a câmera move (padrão: el.raiz)
     camadas: [                        // paralaxe por profundidade (opcional)
       { el: el.$('.luz'), z: -0.5 },  // longe: anda metade
       { el: el.$('.grade'), z: 0 },   // plano focal
       { el: el.$('.titulo'), z: 0.5 },// perto: anda 1,5×
     ],
     modo: '2.5d',                     // '2.5d' (escala/deslocamento por camada) | '3d'
     perspectiva: 1.2,                 // distância câmera → plano focal, em larguras do quadro
     abertura: 0,                      // cqw de desfoque por unidade de |z − foco| (profundidade de campo)
     origem: [50, 50],                 // ponto de fuga, % do quadro
   });
   cam.pose({ zoom, avanco, x, y, giro, rx, ry, foco, desfoque });
   cam.mergulho(t, t0, t1, alvoEl, { cobrir, curva, para }) → { zoom, x, y } (passe para pose)

   x/y são o ponto para onde a câmera OLHA, em cqw a partir do centro do quadro: com x = 12, y = -4
   o ponto (12, -4) do plano focal vai para o centro da tela (o conteúdo anda para a esquerda e para
   baixo), com ou sem camadas e em qualquer zoom. zoom é lente (tudo junto, em volta do centro da
   tela); avanco é dolly (camadas perto crescem mais). Para um close num elemento:
     const P = cam.centro(el.$('.palavra'));          // no montar
     cam.pose({ zoom: 1.6, x: P[0], y: P[1] });       // o elemento no centro, 1,6×
   Em repouso (zoom 1, avanco 0, x = y = 0) nada muda: o quadro aprovado continua sendo o CSS. */
(function () {
  'use strict';
  Motion.estender((api, ctx) => {
    const { clamp, ease, prog, logLerp, lerp } = api;
    const R = ctx.R;
    const W = ctx.formato.largura;
    const H = api.H;
    const u = W / 100;

    function origemPx(el, V) {
      const b = api.caixa(el);
      return `${((V[0] - b.x) * u).toFixed(3)}px ${((V[1] - b.y) * u).toFixed(3)}px`;
    }

    api.camera = function camera(op = {}) {
      const alvo = op.alvo || R.el.raiz;
      const modo = op.modo || '2.5d';
      const perspectiva = op.perspectiva ?? 1.2;
      const abertura = op.abertura ?? 0;
      const origem = op.origem || [50, 50];
      // ponto de fuga em cqw a partir do centro do quadro
      const V = [origem[0] - 50, (origem[1] / 100) * H - H / 2];
      alvo.style.transformOrigin = origemPx(alvo, V);
      const camadas = (op.camadas || []).filter((c) => c && c.el).map((c) => {
        c.el.style.transformOrigin = origemPx(c.el, V);
        return { el: c.el, z: c.z || 0 };
      });
      // o motor confere se alguma camada de plano cheio sob esta câmera ficou sem sobra
      R.__alvosCamera = R.__alvosCamera || [];
      R.__alvosCamera.push(alvo, ...camadas.map((c) => c.el));
      if (modo === '3d') {
        alvo.style.transformStyle = 'preserve-3d';
        for (const c of camadas) c.el.style.transformStyle = 'preserve-3d';
      }
      const Pcqw = perspectiva * 100; // perspectiva em cqw

      function pose({ zoom = 1, avanco = 0, x = 0, y = 0, giro = 0, rx = 0, ry = 0, foco = 0, desfoque = 0 } = {}) {
        if (modo === '3d') {
          api.set(alvo, { pre: '', persp: Pcqw, z: avanco * Pcqw, x: -x * zoom, y: -y * zoom, rx, ry, r: giro, s: zoom, subpixel: true });
          for (const c of camadas) {
            const blur = abertura * Math.abs(c.z - foco);
            api.set(c.el, { pre: '', z: c.z * Pcqw * 0.5, blur });
          }
          if (desfoque || alvo.__mDesf) {
            alvo.__mDesf = true;
            api.set(alvo, { blur: desfoque });
          }
          return;
        }
        if (!camadas.length) {
          // p' = V + zoom·m·(p − V − olhar): o ponto olhado vai para o centro em qualquer zoom
          const m = 1 / Math.max(0.05, 1 - avanco);
          const k = zoom * m;
          api.set(alvo, { pre: '', x: -x * k, y: -y * k, s: k, r: giro, blur: desfoque, subpixel: true });
          return;
        }
        api.set(alvo, { pre: '', s: zoom, r: giro, blur: desfoque, subpixel: true });
        for (const c of camadas) {
          const d = 1 - c.z - avanco;
          const dd = Math.max(0.05, d);
          const m = (1 - c.z) / dd;
          // camada passando pela câmera: apaga e desfoca sozinha
          const passando = clamp((0.12 - d) / 0.07);
          const blur = abertura * Math.abs(c.z - foco) + passando * 1.2;
          api.set(c.el, { pre: '', x: -x / dd, y: -y / dd, s: m, blur, o: 1 - passando });
        }
      }

      function mergulho(t, t0, t1, alvoEl, { cobrir = 1, curva = ease.mergulho, para = null } = {}) {
        if (!alvoEl) return { zoom: 1, x: 0, y: 0 };
        if (!alvoEl.__mCaixa) alvoEl.__mCaixa = api.caixa(alvoEl);
        const b = alvoEl.__mCaixa;
        const S1 = para && para.l ? para.l / b.l : cobrir * Math.max(100 / b.l, H / b.a);
        const e = curva(prog(t, t0, t1));
        const S = logLerp(1, S1, e);
        const dest = para ? [para.cx, para.cy] : [0, 0];
        const k = Math.abs(S1 - 1) < 1e-6 ? e : (S - 1) / (S1 - 1);
        const G = [lerp(b.cx, dest[0], k), lerp(b.cy, dest[1], k)];
        // p' = V + S(p − V − olhar) = G  →  olhar = p − V − (G − V)/S
        return { zoom: S, x: b.cx - V[0] - (G[0] - V[0]) / S, y: b.cy - V[1] - (G[1] - V[1]) / S };
      }

      /** Centro de um elemento (cqw a partir do centro do quadro), medido no layout: para `pose({ x, y })`. */
      function centro(el) {
        if (!el) return [0, 0];
        const b = api.caixa(el);
        return [b.cx, b.cy];
      }

      return { pose, mergulho, centro, caixa: (el) => api.caixaNaTela(el), alvo, camadas };
    };
  });
})();

<script>/* tipo.js — tipografia em movimento (api.tipo).

   Dividir (no montar, nunca no quadro):
     const letras = api.tipo.dividir(el.$('.frase'), { por: 'letra' });   // 'letra' | 'palavra' | 'linha'
     api.tipo.semViuva(el.$('.frase'));                                     // antes de dividir
   Cada parte: { el, i, n, tipo, palavra, linha, iLinha, nLinha, cx, cy, l, a, x0, corpo, kern, destaque }
   (cx, cy, l, a, x0 em cqw a partir do centro do quadro; corpo = tamanho da letra em cqw).

   Receitas (puras, chamadas no quadro): devolvem uma lista de estados { x, y, s, o, blur, r, bright }
   e aplicam nas partes. Para somar duas receitas (entrada + saída), passe { aplicar: false } e junte:
     const a = tipo.focar(t, letras, { inicio: 0.1, aplicar: false });
     const b = tipo.sair(t, letras, { aplicar: false });
     tipo.aplicar(letras, a, b);
   Distâncias de tipografia em em (fração do corpo da letra): o gesto escala com a letra nos dois
   formatos. Texto de leitura nunca tem overshoot. */
(function () {
  'use strict';
  Motion.estender((api, ctx) => {
    const { clamp, lerp, prog, ease, suave, suave5, rand, logLerp, estilo } = api;
    const R = ctx.R;
    const palco = ctx.palco;
    const curvaPadrao = Array.isArray(estilo.curvaEntrada) ? ease.bezier(...estilo.curvaEntrada) : ease.forte;

    /* ─── dividir ─── */
    function semViuva(el) {
      if (typeof el === 'string') el = R.conteudo.querySelector(el);
      if (!el) return;
      const nos = [];
      const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      for (let n = w.nextNode(); n; n = w.nextNode()) nos.push(n);
      let viuPalavra = false;
      for (let i = nos.length - 1; i >= 0; i--) {
        const txt = nos[i].textContent;
        for (let j = txt.length - 1; j >= 0; j--) {
          const ch = txt[j];
          if (/\s/.test(ch) && ch !== ' ') {
            if (viuPalavra) {
              nos[i].textContent = txt.slice(0, j) + ' ' + txt.slice(j + 1);
              return;
            }
          } else if (ch !== ' ') viuPalavra = true;
        }
      }
    }

    function dividir(el, { por = 'letra', kerning = true, mascara = false } = {}) {
      if (typeof el === 'string') el = R.conteudo.querySelector(el);
      if (!el) return [];
      const chave = `__mPartes_${por}`;
      if (el[chave]) return el[chave];
      const P = palco.getBoundingClientRect();
      const escala = P.width / palco.offsetWidth || 1;
      const u = P.width / 100;
      const uLayout = palco.offsetWidth / 100;

      // posição natural de cada letra (com o kerning da fonte), antes de dividir
      const naturais = [];
      if (por === 'letra' && kerning) {
        const range = document.createRange();
        const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
        for (let n = w.nextNode(); n; n = w.nextNode()) {
          if (n.parentElement && n.parentElement.closest('svg')) continue;
          let i = 0;
          for (const ch of n.textContent) {
            if (!/\s/.test(ch)) {
              range.setStart(n, i);
              range.setEnd(n, i + ch.length);
              naturais.push(range.getBoundingClientRect().left);
            }
            i += ch.length;
          }
        }
      }

      const letras = [];
      const palavras = [];
      const andar = (no) => {
        for (const filho of [...no.childNodes]) {
          if (filho.nodeType === 3) {
            const frag = document.createDocumentFragment();
            for (const pedaco of filho.textContent.split(/(\s+)/)) {
              if (!pedaco) continue;
              if (/^\s+$/.test(pedaco)) {
                frag.appendChild(document.createTextNode(pedaco));
                continue;
              }
              const pal = document.createElement('span');
              pal.className = por === 'letra' ? 'm-palavra' : 'm-palavra m-bloco';
              palavras.push(pal);
              if (por === 'letra') {
                for (const ch of pedaco) {
                  const l = document.createElement('span');
                  l.className = 'm-letra';
                  l.textContent = ch;
                  if (/\s/.test(ch)) l.classList.add('m-espaco');
                  pal.appendChild(l);
                  if (!/\s/.test(ch)) letras.push(l);
                }
              } else pal.textContent = pedaco;
              frag.appendChild(pal);
            }
            filho.replaceWith(frag);
          } else if (filho.nodeType === 1 && filho.tagName !== 'BR' && filho.tagName.toLowerCase() !== 'svg' && !filho.classList.contains('m-palavra')) {
            andar(filho);
          }
        }
      };

      let partesEl;
      if (por === 'linha') {
        // por linha: <br> manda; sem <br>, mede as linhas pelos nós de primeiro nível
        const grupos = [[]];
        const temBr = !!el.querySelector('br');
        if (temBr) {
          for (const n of [...el.childNodes]) {
            if (n.nodeName === 'BR') {
              grupos.push([]);
              n.remove();
            } else grupos[grupos.length - 1].push(n);
          }
        } else {
          andar(el);
          let topoAtual = null;
          for (const n of [...el.childNodes]) {
            const alvo = n.nodeType === 1 ? n : null;
            if (alvo) {
              const r = (alvo.querySelector('.m-palavra') || alvo).getBoundingClientRect();
              const fs = parseFloat(getComputedStyle(alvo).fontSize) * escala;
              if (topoAtual !== null && Math.abs(r.top - topoAtual) > fs * 0.4) grupos.push([]);
              topoAtual = r.top;
            }
            grupos[grupos.length - 1].push(n);
          }
        }
        partesEl = grupos
          .filter((g) => g.some((n) => (n.textContent || '').trim()))
          .map((g) => {
            const linha = document.createElement('span');
            linha.className = 'm-linha' + (mascara ? ' m-mascara' : '');
            const dentro = document.createElement('span');
            dentro.className = 'm-linha-in';
            while (g.length && g[0].nodeType === 3 && !g[0].textContent.trim()) g.shift().remove();
            for (const n of g) dentro.appendChild(n);
            linha.appendChild(dentro);
            return { linha, dentro };
          });
        el.textContent = '';
        for (const { linha } of partesEl) el.appendChild(linha);
        partesEl = partesEl.map((x) => x.dentro);
      } else {
        andar(el);
        partesEl = por === 'letra' ? letras : palavras;
      }

      // medir
      const partes = partesEl.map((pe, i) => {
        const r = pe.getBoundingClientRect();
        const fs = parseFloat(getComputedStyle(pe).fontSize) || 16;
        const xx = (r.left - P.left) / u - 50;
        const yy = (r.top - P.top) / u - (P.height / P.width) * 50;
        return {
          el: pe,
          i,
          n: partesEl.length,
          tipo: por,
          l: r.width / u,
          a: r.height / u,
          x0: xx,
          cx: xx + r.width / u / 2,
          cy: yy + r.height / u / 2,
          topo: r.top,
          corpo: fs / uLayout,
          kern: 0,
          destaque: !!pe.closest('.destaque, [data-destaque]'),
        };
      });
      if (por === 'letra' && naturais.length === partes.length) {
        partes.forEach((p, i) => {
          const kpx = naturais[i] - p.el.getBoundingClientRect().left;
          if (Math.abs(kpx) > 0.01) {
            p.el.style.translate = `${(kpx / escala).toFixed(3)}px 0px`;
            p.kern = kpx / u;
            p.x0 += p.kern;
            p.cx += p.kern;
          }
        });
      }
      // palavra e linha de cada parte
      const tops = [];
      for (const p of partes) {
        const lim = p.corpo * u * 0.4;
        let k = tops.findIndex((tp) => Math.abs(tp - p.topo) < lim);
        if (k < 0) {
          tops.push(p.topo);
          k = tops.length - 1;
        }
        p.linha = k;
      }
      const ordemLinhas = tops.map((tp, k) => [tp, k]).sort((a, b) => a[0] - b[0]).map((x) => x[1]);
      for (const p of partes) p.linha = ordemLinhas.indexOf(p.linha);
      const porLinha = {};
      for (const p of partes) (porLinha[p.linha] = porLinha[p.linha] || []).push(p);
      for (const k in porLinha) {
        const lista = porLinha[k].sort((a, b) => a.cx - b.cx);
        lista.forEach((p, j) => {
          p.iLinha = j;
          p.nLinha = lista.length;
        });
      }
      if (por === 'letra') {
        partes.forEach((p) => {
          const pal = p.el.closest('.m-palavra');
          p.palavra = palavras.indexOf(pal);
        });
      } else partes.forEach((p, i) => (p.palavra = i));

      // degradê contínuo nas palavras de destaque: cada parte recebe a sua fatia
      const destaques = new Set(partes.filter((p) => p.destaque).map((p) => p.el.closest('.destaque, [data-destaque]')));
      for (const d of destaques) {
        const cs = getComputedStyle(d);
        const imagem = cs.backgroundImage;
        if (!imagem || imagem === 'none') continue;
        const caixa = d.getBoundingClientRect();
        for (const p of partes) {
          if (!d.contains(p.el)) continue;
          const r = p.el.getBoundingClientRect();
          const s = p.el.style;
          s.backgroundImage = imagem;
          s.backgroundSize = `${(caixa.width / escala).toFixed(2)}px ${(caixa.height / escala).toFixed(2)}px`;
          s.backgroundPosition = `${(-(r.left - caixa.left) / escala).toFixed(2)}px ${(-(r.top - caixa.top) / escala).toFixed(2)}px`;
          s.backgroundRepeat = 'no-repeat';
          s.webkitBackgroundClip = 'text';
          s.backgroundClip = 'text';
          s.webkitTextFillColor = 'transparent';
          s.color = 'transparent';
          p.fundoBase = { imagem, x: -(r.left - caixa.left) / escala, y: -(r.top - caixa.top) / escala };
        }
        d.style.backgroundImage = 'none';
        d.style.webkitTextFillColor = 'initial';
        d.classList.add('m-destaque-dividido');
      }
      el[chave] = partes;
      return partes;
    }

    /* ─── ordem e junção ─── */
    function rank(i, n, ordem = 'normal') {
      const c = (n - 1) / 2;
      if (ordem === 'reversa') return n - 1 - i;
      if (ordem === 'centro') return Math.abs(i - c);
      if (ordem === 'pontas') return c - Math.abs(i - c);
      if (typeof ordem === 'number') return rand(ordem + i * 13.7) * (n - 1);
      if (typeof ordem === 'function') return ordem(i, n);
      return i;
    }
    const rankDe = (p, partes, ordem) => (ordem === 'linha' ? rank(p.iLinha ?? p.i, p.nLinha ?? partes.length) : rank(p.i, partes.length, ordem));
    /** A frase inteira fica legível a tempo: a cascata total não passa de `max` s (comprime a cascata). */
    function limitarCascata(cascata, partes, ordem, max) {
      if (!max || partes.length < 2) return cascata;
      if (!partes.__mRankMax || partes.__mRankMax[0] !== ordem) partes.__mRankMax = [ordem, Math.max(0, ...partes.map((p) => rankDe(p, partes, ordem)))];
      const n = partes.__mRankMax[1];
      return n > 0 ? Math.min(cascata, max / n) : cascata;
    }
    /** Cor de brasa na letra: mistura `cor` na cor natural (q = 1 quente, 0 assentado) e um brilho em
        volta que some junto. Em q = 0 tira tudo (o quadro aprovado é o CSS). Letra de destaque
        (degradê recortado no texto) só recebe o brilho em volta. */
    function pintarCalor(el, q, cor) {
      if (!el) return;
      if (el.__mCorBase === undefined) el.__mCorBase = getComputedStyle(el).color;
      const destaque = el.classList.contains('m-letra') && el.style.webkitTextFillColor === 'transparent';
      if (q <= 0.002) {
        if (!destaque) el.style.color = '';
        el.style.textShadow = '';
        return;
      }
      if (!destaque) el.style.color = `color-mix(in srgb, ${cor} ${(q * 100).toFixed(1)}%, ${el.__mCorBase})`;
      el.style.textShadow = `0 0 ${(0.34 * q).toFixed(3)}em color-mix(in srgb, ${cor} ${(q * 62).toFixed(1)}%, transparent)`;
    }

    function juntar(...listas) {
      const n = Math.max(0, ...listas.filter(Boolean).map((l) => l.length));
      const out = [];
      for (let i = 0; i < n; i++) {
        const e = { x: 0, y: 0, r: 0, blur: 0, s: 1, o: 1, bright: 1 };
        for (const l of listas) {
          const x = l && l[i];
          if (!x) continue;
          if (x.x) e.x += x.x;
          if (x.y) e.y += x.y;
          if (x.r) e.r += x.r;
          if (x.blur) e.blur += x.blur;
          if (x.s !== undefined) e.s *= x.s;
          if (x.o !== undefined) e.o *= x.o;
          if (x.bright !== undefined) e.bright *= x.bright;
          if (x.sx !== undefined) e.sx = (e.sx ?? 1) * x.sx;
          if (x.sy !== undefined) e.sy = (e.sy ?? 1) * x.sy;
        }
        out.push(e);
      }
      return out;
    }

    function aplicar(partes, ...listas) {
      const est = juntar(...listas);
      partes.forEach((p, i) => {
        const e = est[i];
        if (!e) return;
        const o = { x: e.x, y: e.y, r: e.r, s: e.s, o: e.o, blur: e.blur, bright: e.bright, pre: '' };
        if (e.sx !== undefined || e.sy !== undefined) Object.assign(o, { sx: e.sx ?? 1, sy: e.sy ?? 1 });
        api.set(p.el, o);
      });
      return est;
    }
    const fim = (partes, est, op) => {
      if (op.aplicar !== false) aplicar(partes, est);
      return est;
    };

    /* ─── receitas ─── */

    /** C3.1 Desfoque → foco, subida curta, por letra ou palavra. A base de tudo. */
    function focar(t, partes, op = {}) {
      const letra = partes[0] && partes[0].tipo === 'letra';
      const {
        inicio = 0,
        cascata = letra ? estilo.cascataLetra : estilo.cascataPalavra,
        dur = estilo.entrada,
        subida = estilo.subida,
        desfoque = estilo.desfoque,
        opacidade = estilo.opacidade,
        curva = curvaPadrao,
        ordem = 'normal',
        escala = 1,
        lateral = 0,
        cascataMax = 0.5,
      } = op;
      const casc = limitarCascata(cascata, partes, ordem, cascataMax);
      const est = partes.map((p) => {
        const t0 = inicio + casc * rankDe(p, partes, ordem);
        const e = curva(prog(t, t0, t0 + dur));
        return {
          x: lateral * p.corpo * (1 - e),
          y: subida * p.corpo * (1 - e),
          blur: desfoque * p.corpo * (1 - e),
          o: suave(prog(t, t0, t0 + opacidade)),
          s: lerp(escala, 1, e),
        };
      });
      return fim(partes, est, op);
    }

    /** C3.2 A lente encontra a frase: uma profundidade z por letra gera ampliação a partir do eixo,
        tracking proporcional, subida curta e desfoque de profundidade contra o foco. */
    function lente(t, partes, op = {}) {
      const {
        inicio = 0,
        cascata = estilo.cascataLetra,
        z0 = 1,
        mag = 0.32,
        tracking = 0.21,
        plano = 0.4,
        letra = 0.34,
        dof = 0.19,
        foco = 0,
        subida = estilo.subida,
        opacidade = 0.16,
        ordem = 'normal',
        cascataMax = 0.55,
      } = op;
      const cascL = limitarCascata(cascata, partes, ordem, cascataMax);
      const focoT = typeof foco === 'function' ? foco(t) : foco;
      const { eixo = 'palavra' } = op;
      if (!partes.__mLente) {
        // centro e índice de cada letra dentro da palavra: cada palavra é um plano que amplia a
        // partir do próprio centro (amplia a partir do eixo do quadro com eixo: 'quadro')
        const pal = {};
        for (const p of partes) (pal[p.palavra] = pal[p.palavra] || []).push(p);
        for (const k in pal) {
          const l = pal[k].sort((a, b) => a.cx - b.cx);
          const esq = Math.min(...l.map((p) => p.x0)), dir = Math.max(...l.map((p) => p.x0 + p.l));
          const cy = l.reduce((s, p) => s + p.cy, 0) / l.length;
          l.forEach((p, j) => Object.assign(p, { __pc: [(esq + dir) / 2, cy], __pi: j, __pn: l.length }));
        }
        partes.__mLente = true;
      }
      const iniPalavra = {};
      partes.forEach((p) => {
        const t0 = inicio + cascL * rankDe(p, partes, ordem);
        p.__t0 = t0;
        if (iniPalavra[p.palavra] === undefined || t0 < iniPalavra[p.palavra]) iniPalavra[p.palavra] = t0;
      });
      const est = partes.map((p) => {
        const t0 = p.__t0;
        const zl = z0 * (1 - ease.outExpo(prog(t, t0, t0 + letra)));
        const tp = iniPalavra[p.palavra];
        const zp = z0 * (1 - ease.outExpo(prog(t, tp, tp + plano)));
        const c = eixo === 'quadro' ? [0, 0] : p.__pc;
        const trk = eixo === 'quadro'
          ? ((p.iLinha ?? p.i) - ((p.nLinha ?? partes.length) - 1) / 2) * tracking * p.corpo
          : (p.__pi - (p.__pn - 1) / 2) * tracking * p.corpo;
        return {
          x: ((p.cx - c[0]) * mag + trk) * zp,
          y: (p.cy - c[1]) * mag * zp + subida * p.corpo * zl,
          s: 1 + mag * zp,
          blur: dof * p.corpo * Math.abs(zl - focoT),
          o: suave(prog(t, t0, t0 + opacidade)),
        };
      });
      return fim(partes, est, op);
    }

    /** Cada linha sobe de trás de uma máscara na própria linha de base (dividir por 'linha' com mascara: true). */
    function mascara(t, partes, op = {}) {
      const { inicio = 0, cascata = 0.08, dur = 0.7, curva = curvaPadrao, ordem = 'normal', desfoque = 0 } = op;
      const est = partes.map((p) => {
        const t0 = inicio + cascata * rankDe(p, partes, ordem);
        const e = curva(prog(t, t0, t0 + dur));
        return { y: p.a * 1.08 * (1 - e), o: suave(prog(t, t0, t0 + 0.06)), blur: desfoque * p.corpo * (1 - e) };
      });
      return fim(partes, est, op);
    }

    /** Saída rápida que acelera até o último quadro. modo: desfoque | tracking | pontas | camera. */
    function sair(t, partes, op = {}) {
      const dur = op.dur ?? estilo.saida;
      const { inicio = api.dur - dur, modo = 'desfoque', curva = ease.inExpo, desfoque = estilo.desfoque * 1.5 } = op;
      const cascata = op.cascata ?? (modo === 'pontas' ? 0.035 : 0);
      const ordem = op.ordem ?? (modo === 'pontas' ? 'pontas' : 'normal');
      const nMax = Math.max(0, ...partes.map((p) => rankDe(p, partes, ordem)));
      const est = partes.map((p) => {
        // a última parte termina junto com a saída: as outras começam antes
        const t0 = inicio + cascata * (rankDe(p, partes, ordem) - nMax);
        const e = curva(prog(t, t0, t0 + dur));
        const c = ((p.nLinha ?? partes.length) - 1) / 2;
        const d = (p.iLinha ?? p.i) - c;
        if (modo === 'tracking') return { x: d * 0.28 * p.corpo * e, o: 1 - e, blur: desfoque * 0.6 * p.corpo * e };
        if (modo === 'camera') return { s: 1 + 1.4 * e, x: p.cx * 1.4 * e, y: p.cy * 1.4 * e, o: 1 - e * e, blur: desfoque * 1.6 * p.corpo * e };
        return { y: -estilo.subida * 0.6 * p.corpo * e, o: 1 - e, blur: desfoque * p.corpo * e };
      });
      return fim(partes, est, op);
    }

    /** Reflexo de borda nítida que atravessa a palavra uma vez (soma luz, não engorda a letra).
        Precisa de partes por letra. Passe { aplicar } não: o brilho é desenhado por ::after. */
    function brilho(t, partes, op = {}) {
      const { inicio = 0, dur = 0.7, angulo = 104, nucleo = 0.19, borda = 0.13, forca = 0.5, cor = 'var(--brilho, #ffffff)' } = op;
      if (!partes.length) return;
      if (!partes.__mBrilho) {
        const esq = Math.min(...partes.map((p) => p.x0));
        const dir = Math.max(...partes.map((p) => p.x0 + p.l));
        const corpo = partes[0].corpo;
        const meia = (nucleo / 2 + borda) * corpo;
        const caixa = Math.max(meia * 2 + 2 * corpo * 0.6, corpo * 1.2);
        const tinta = `color-mix(in srgb, ${cor} ${Math.round(clamp(forca) * 1000) / 10}%, transparent)`;
        for (const p of partes) {
          p.el.dataset.mCh = p.el.textContent;
          p.el.classList.add('m-brilho');
          const s = p.el.style;
          s.setProperty('--m-brilho-tinta', tinta);
          s.setProperty('--m-brilho-angulo', `${angulo}deg`);
          s.setProperty('--m-brilho-nucleo', `${((nucleo / 2) * corpo).toFixed(4)}cqw`);
          s.setProperty('--m-brilho-meia', `${meia.toFixed(4)}cqw`);
          s.setProperty('--m-brilho-caixa', `${caixa.toFixed(4)}cqw`);
        }
        partes.__mBrilho = { esq, dir, caixa, alcance: meia + corpo * 0.5 };
      }
      const B = partes.__mBrilho;
      const ativo = t > inicio && t < inicio + dur;
      const pos = B.esq - B.alcance + (B.dir - B.esq + 2 * B.alcance) * prog(t, inicio, inicio + dur);
      for (const p of partes) {
        // posição da máscara no ::after (que começa 0,2 em à esquerda da letra)
        const x = ativo ? pos - p.x0 + 0.2 * p.corpo - B.caixa / 2 : -400;
        p.el.style.setProperty('--m-brilho-x', `${x.toFixed(4)}cqw`);
      }
    }

    /** C3.5 Tracking largo e fora de foco que fecha até o aprovado e continua fechando de leve no hold. */
    function aproximar(t, partes, op = {}) {
      const { inicio = 0, dur = 1.0, espaco = 0.5, desfoque = estilo.desfoque, fecha = 0.004, ref = api.ref, curva = ease.outQuart, opacidade = 0.3 } = op;
      const e = curva(prog(t, inicio, inicio + dur));
      const est = partes.map((p) => {
        const d = (p.iLinha ?? p.i) - ((p.nLinha ?? partes.length) - 1) / 2;
        return { x: d * p.corpo * (espaco * (1 - e) - fecha * (t - ref)), blur: desfoque * p.corpo * (1 - e), o: suave(prog(t, inicio, inicio + opacidade)) };
      });
      return fim(partes, est, op);
    }

    /** Depois do pouso o tracking continua abrindo bem devagar o hold inteiro (passa pelo aprovado em ref). */
    function exalar(t, partes, op = {}) {
      const { inicio = 0, velocidade = 0.0055, ref = api.ref } = op;
      const k = api.deriva(t, inicio, 0.6) - api.deriva(ref, inicio, 0.6);
      const est = partes.map((p) => {
        const d = (p.iLinha ?? p.i) - ((p.nLinha ?? partes.length) - 1) / 2;
        return { x: d * p.corpo * velocidade * k };
      });
      return fim(partes, est, op);
    }

    /** C3.9 As pontas partem primeiro e todas chegam juntas a um ponto; viram luz antes de encolher. */
    function sugar(t, partes, op = {}) {
      const { inicio = 0, dur = 0.25, ponto = [0, 0], espera = 0.06, escalaFinal = 0.2, curva = ease.inCubic } = op;
      const dists = partes.map((p) => Math.hypot(p.cx - ponto[0], p.cy - ponto[1]));
      const dMax = Math.max(1e-6, ...dists);
      const est = partes.map((p, i) => {
        const t0 = inicio + (1 - dists[i] / dMax) * espera;
        const e = curva(prog(t, t0, inicio + dur));
        return {
          x: (ponto[0] - p.cx) * e,
          y: (ponto[1] - p.cy) * e,
          s: lerp(1, escalaFinal, e),
          bright: 1 + 1.6 * suave(e * 1.4),
          blur: 0.14 * p.corpo * e,
          o: 1 - suave(prog(e, 0.72, 1)),
        };
      });
      return fim(partes, est, op);
    }

    /** C3.8 Primeiro o brilho da palavra inteira, depois as letras sobem de um horizonte, quentes,
        esfriando. Com `cor` (ex.: 'var(--destaque)'), a letra nasce NA cor de brasa e esfria até a
        cor dela (em letra clara, calor só por brilho vira mancha cinza). Legível em ~0,25 s por letra. */
    function nascerDaLuz(t, partes, op = {}) {
      const { inicio = 0, brilho: tb = 0.2, cascata = estilo.cascataLetra, dur = 0.5, calor = 2.2, subida = 0.35, ordem = 'normal', cor = null, cascataMax = 0.45 } = op;
      const casc = limitarCascata(cascata, partes, ordem, cascataMax);
      const silhueta = suave(prog(t, inicio, inicio + tb * 0.7)) * (cor ? 0.62 : 0.45);
      const est = partes.map((p) => {
        const t0 = inicio + tb + casc * rankDe(p, partes, ordem);
        const e = ease.outExpo(prog(t, t0, t0 + dur));
        const o = lerp(silhueta, 1, suave(prog(t, t0, t0 + 0.12)));
        const quente = 1 - ease.outCubic(prog(t, t0, t0 + dur * 1.6)); // 1 quente → 0 assentado
        if (cor) pintarCalor(p.el, quente, cor);
        return {
          y: subida * p.corpo * (1 - e),
          o,
          bright: cor ? 1 + 0.3 * quente : lerp(calor, 1, 1 - quente),
          // desfoque curto: a silhueta é macia, a letra fica nítida em ~0,2 s depois de nascer
          blur: (cor ? 0.07 : 0.1) * p.corpo * (1 - ease.outCubic(prog(t, t0 - 0.04, t0 + Math.min(0.22, dur * 0.45)))),
        };
      });
      return fim(partes, est, op);
    }

    /** C9.5 Letras vindas do fundo (pequenas, nítidas, em vórtice) ou de trás da câmera (enormes, desfocadas). */
    function cinetica(t, partes, op = {}) {
      const { inicio = 0, semente = 1, cascata = 0.03, dur = 0.8, de = 'misto', perto = 6.5, longe = 0.34, giro = 40, curva = curvaPadrao } = op;
      const est = partes.map((p, i) => {
        const r = rand(semente * 31.7 + i);
        const doFundo = de === 'fundo' || (de === 'misto' && r < 0.5);
        const ang = rand(semente * 17.1 + i * 3.3) * Math.PI * 2;
        const t0 = inicio + cascata * rank(i, partes.length, semente + 0.5);
        const e = curva(prog(t, t0, t0 + dur));
        let s0, dx, dy, r0, b0;
        if (doFundo) {
          s0 = longe;
          dx = Math.cos(ang) * p.corpo * 2.2 - p.cx * (1 - longe);
          dy = Math.sin(ang) * p.corpo * 2.2 - p.cy * (1 - longe);
          r0 = (rand(semente + i * 7.7) - 0.5) * 2 * giro;
          b0 = 0;
        } else {
          s0 = perto;
          dx = p.cx * (perto - 1) * 0.7 + Math.cos(ang) * p.corpo;
          dy = p.cy * (perto - 1) * 0.7 + Math.sin(ang) * p.corpo;
          r0 = (rand(semente + i * 5.1) - 0.5) * giro;
          b0 = 0.5 * p.corpo;
        }
        return {
          x: dx * (1 - e),
          y: dy * (1 - e),
          s: logLerp(s0, 1, e),
          r: r0 * (1 - e),
          blur: b0 * Math.pow(1 - e, 2),
          o: suave(prog(t, t0, t0 + 0.08)),
        };
      });
      return fim(partes, est, op);
    }

    /** C3.8 Letras entram na cor do texto; um véu de borda macia revela o degradê do destaque. */
    function varrerDestaque(t, partes, op = {}) {
      const { inicio = 0, dur = 0.5, suavidade = 0.8, cor = 'var(--texto)', curva = ease.inOutCubic } = op;
      const lista = partes.filter((p) => p.destaque);
      if (!lista.length) return;
      const esq = Math.min(...lista.map((p) => p.x0));
      const dir = Math.max(...lista.map((p) => p.x0 + p.l));
      const corpo = lista[0].corpo;
      const soft = suavidade * corpo;
      const pos = esq - soft + (dir - esq + 2 * soft) * curva(prog(t, inicio, inicio + dur));
      for (const p of lista) {
        const a = 1 - suave((pos - p.cx) / soft + 0.5);
        p.el.style.webkitTextFillColor = a <= 0.001 ? 'transparent' : `color-mix(in srgb, ${cor} ${(a * 100).toFixed(2)}%, transparent)`;
      }
    }

    /** O degradê do destaque gira um fio no hold (vida), passando pelo aprovado em ref. */
    function derivaDestaque(t, partes, op = {}) {
      const { graus = 4, periodo = 5, ref = api.ref, inicio = 0 } = op;
      const ang = graus * Math.sin((2 * Math.PI * (t - ref)) / periodo) * suave5(prog(t, inicio, inicio + 0.8));
      for (const p of partes) {
        if (!p.fundoBase) continue;
        const img = p.fundoBase.imagem.replace(/linear-gradient\((-?[\d.]+)deg/, (m, a) => `linear-gradient(${(parseFloat(a) + ang).toFixed(3)}deg`);
        p.el.style.backgroundImage = img;
      }
    }

    /** Número que conta e trava na batida (1 − (1−x)²). Só número verdadeiro. */
    function contar(t, el, op = {}) {
      if (typeof el === 'string') el = R.conteudo.querySelector(el);
      if (!el) return;
      const { de = 0, ate = 100, inicio = 0, travar = inicio + 1, casas = 0, local = 'pt-BR', prefixo = '', sufixo = '' } = op;
      const x = prog(t, inicio, travar);
      const v = lerp(de, ate, 1 - (1 - x) * (1 - x));
      el.textContent = prefixo + v.toLocaleString(local, { minimumFractionDigits: casas, maximumFractionDigits: casas }) + sufixo;
    }

    /** Digitação determinística (busca, terminal, campo de mockup). */
    function digitar(t, el, op = {}) {
      if (typeof el === 'string') el = R.conteudo.querySelector(el);
      if (!el) return;
      if (el.__mTexto === undefined) el.__mTexto = op.texto ?? el.textContent;
      const { inicio = 0, cps = 18, cursor = true } = op;
      const txt = el.__mTexto;
      const n = clamp(Math.floor((t - inicio) * cps), 0, txt.length);
      const fimDigitar = inicio + txt.length / cps;
      el.textContent = txt.slice(0, n);
      if (cursor) {
        const c = document.createElement('span');
        c.className = 'm-cursor';
        c.style.opacity = String(1 - suave(prog(t, fimDigitar + 0.3, fimDigitar + 0.6)));
        el.appendChild(c);
      }
    }

    /** Vida no hold na camada do texto (escala ≤ 1 %), nunca em letter-spacing. */
    function respirar(t, el, op = {}) {
      if (typeof el === 'string') el = R.conteudo.querySelector(el);
      const { amp = 0.006, periodo = 4, inicio = 0, fase = 0 } = op;
      api.set(el, { s: 1 + api.vida(t, { inicio, periodo, amp, fase }), subpixel: true });
    }

    /** C3.3 Um bloco desliza de `de` a `ate` (cqw) com arranque macio e pouso em que velocidade e
        desaceleração chegam juntas a zero; rastro de obturador na direção do movimento. */
    function empurrar(t, el, op = {}) {
      if (typeof el === 'string') el = R.conteudo.querySelector(el);
      if (!el) return;
      const { de = 0, ate = 0, inicio = 0, fim: tf = inicio + 0.7, eixo = 'x', pouso = 0.5, obturador = true } = op;
      const chave = `${inicio}|${tf}|${pouso}`;
      el.__mTraj = el.__mTraj || {};
      if (!el.__mTraj[chave]) {
        const rampa = Math.min(0.09, (tf - inicio) * 0.2);
        el.__mTraj[chave] = api.trajeto((tt) => suave5(prog(tt, inicio, inicio + rampa)) * (1.15 - 0.6 * prog(tt, inicio, tf)), inicio, tf, { pouso });
      }
      const pos = (tt) => lerp(de, ate, el.__mTraj[chave](tt));
      const v = pos(t);
      api.set(el, eixo === 'x' ? { x: v } : { y: v });
      if (obturador && api.fx) {
        const vel = api.fx.velocidade(pos, t);
        api.fx.obturador(el, eixo === 'x' ? vel : 0, eixo === 'x' ? 0 : vel);
      }
      return v;
    }

    /** Escala de filme sem chute: ajusta o corpo da letra para o texto ocupar `largura` (fração da
        largura do quadro) na linha mais longa, entre `min` e `max` cqmin. Chame no montar, ANTES de
        dividir: é layout (vale para o quadro aprovado e para o storyboard), não tempo. Devolve o
        corpo em cqmin. Ex.: api.tipo.caber(el.$('.palavra'), { largura: 0.84, max: 46 }). */
    function caber(el, { largura = 0.84, max = 60, min = 4 } = {}) {
      if (typeof el === 'string') el = R.conteudo.querySelector(el);
      if (!el) return null;
      const P = palco.getBoundingClientRect();
      const escala = P.width / palco.offsetWidth || 1;
      const um = Math.min(palco.offsetWidth, palco.offsetHeight) / 100;
      const fs = parseFloat(getComputedStyle(el).fontSize) || 16;
      // a linha mais larga (com <br> ou quebra natural): mede cada retângulo de linha do texto
      const range = document.createRange();
      range.selectNodeContents(el);
      const linhas = new Map();
      for (const r of range.getClientRects()) {
        if (r.width < 0.5) continue;
        const k = Math.round(r.top / (fs * escala * 0.5));
        const l = linhas.get(k) || [Infinity, -Infinity];
        linhas.set(k, [Math.min(l[0], r.left), Math.max(l[1], r.right)]);
      }
      let w = 0;
      for (const [a, b] of linhas.values()) w = Math.max(w, (b - a) / escala);
      if (!w) return fs / um;
      const alvo = largura * palco.offsetWidth;
      const novo = clamp((fs * alvo) / w / um, min, max);
      el.style.fontSize = `${novo.toFixed(3)}cqmin`;
      return novo;
    }

    api.tipo = {
      caber,
      dividir, semViuva, aplicar, juntar, rank,
      focar, lente, mascara, sair, brilho, aproximar, exalar, sugar, nascerDaLuz, cinetica,
      varrerDestaque, derivaDestaque, contar, digitar, respirar, empurrar,
      revelar: focar, pintarCalor, limitarCascata,
    };
    // atalhos com os nomes de sempre
    api.dividir = dividir;
    api.revelar = focar;
  });
})();

<script>/* dinamicas.js — física de objeto (api.fisica), efeitos de luz e pintura (api.fx, api.pintura).

   Física é só para OBJETO (card, mockup, selo, ícone, marca): overshoot, quique e mola são
   permitidos aqui e proibidos em texto de leitura. Tudo puro em t. */
(function () {
  'use strict';
  Motion.estender((api, ctx) => {
    const { clamp, lerp, prog, ease, suave, suave5, mola, hermite, rand } = api;
    const R = ctx.R;
    const u = ctx.formato.largura / 100; // px por cqw

    /* ─── física ─── */
    const fisica = {
      /** Quiques de altura decrescente depois do primeiro contato em t0. Devolve a altura (≥ 0, cqw). */
      quique(t, t0, { altura = 4, razao = 0.38, n = 3, dur = 0.32 } = {}) {
        let tt = t - t0;
        if (tt <= 0) return 0;
        let h = altura * razao;
        let d = dur * Math.sqrt(razao);
        for (let i = 0; i < n; i++) {
          if (tt < d) {
            const x = tt / d;
            return 4 * h * x * (1 - x);
          }
          tt -= d;
          h *= razao;
          d *= Math.sqrt(razao);
        }
        return 0;
      },
      /** Cada impacto afunda o conjunto e ele devolve (oscilação amortecida). Devolve o deslocamento (fração). */
      afundar(t, impactos = [], { forca = 0.02, freq = 7, amort = 9 } = {}) {
        let s = 0;
        for (const ti of impactos) s += -forca * 2 * Math.PI * freq * mola(t - ti, 1, { freq, amort });
        return s;
      },
      /** Envelope de impacto: ataque de um quadro e decaimento outExpo (0..1). */
      impacto(t, t0, { ataque = api.umQuadro, decaimento = 0.45 } = {}) {
        if (t <= t0) return 0;
        if (t < t0 + ataque) return (t - t0) / ataque;
        return 1 - ease.outExpo(prog(t, t0 + ataque, t0 + ataque + decaimento));
      },
      /** Tique: passa `passa` graus do ponto e volta, sem quique (giro de chave). Devolve graus extras. */
      tique(t, t0, { passa = 6, dur = 0.28 } = {}) {
        const x = prog(t, t0, t0 + dur);
        return x <= 0 || x >= 1 ? 0 : passa * api.pulsoSemQuique(x, 0.3) * (1 - suave(prog(x, 0.6, 1)));
      },
      /** Amassa no impacto e volta (mola amortecida). Devolve { sx, sy }. */
      amassar(t, t0, { forca = 0.08, freq = 2.4, amort = 6 } = {}) {
        const tau = t - t0;
        if (tau <= 0) return { sx: 1, sy: 1 };
        const s = forca * Math.exp(-amort * tau) * Math.cos(2 * Math.PI * freq * tau);
        return { sx: 1 + s * 0.6, sy: 1 - s };
      },
      /** Arremesso: Hermite até o contato em tc e, depois, mola que herda a velocidade. Escalar ou [x, y]. */
      arremesso(t, { t0 = 0, tc = 0.5, p0 = 0, v0 = 0, contato = 0, vc = null, freq = 2.2, amort = 6 } = {}) {
        const um = (a, va, c, vcc) => {
          const v1 = vcc ?? (c - a) / Math.max(1e-6, tc - t0) * 1.6;
          if (t <= tc) return hermite(t, t0, tc, a, va, c, v1);
          return c + mola(t - tc, v1, { freq, amort });
        };
        if (Array.isArray(p0)) return p0.map((a, i) => um(a, Array.isArray(v0) ? v0[i] : v0, contato[i], vc && vc[i]));
        return um(p0, v0, contato, vc);
      },
      /** Cai de perto da câmera: quase parado no alto, acelera como u⁴. Devolve 0..1. */
      cair(t, t0, t1) {
        const x = prog(t, t0, t1);
        return x * x * x * x;
      },
      spring: api.spring,
    };

    /* ─── efeitos ─── */
    let svgFx = null;
    function svgDoMotor() {
      if (svgFx && svgFx.isConnected) return svgFx;
      svgFx = document.getElementById('m-fx-svg');
      if (!svgFx) {
        svgFx = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svgFx.id = 'm-fx-svg';
        svgFx.setAttribute('width', '0');
        svgFx.setAttribute('height', '0');
        svgFx.setAttribute('aria-hidden', 'true');
        svgFx.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden';
        ctx.palco.appendChild(svgFx);
      }
      return svgFx;
    }
    let contadorFiltro = 0;

    /** Perfil de luz sem borda: queda até zero com inclinação zero (1 − smoothstep em muitas paradas). */
    function gradienteDeLuz(cor = 'var(--luz-1)', forca = 1, { forma = 'circle', paradas = 14, ate = 70, cx = 50, cy = 50 } = {}) {
      const ps = [];
      for (let i = 0; i <= paradas; i++) {
        const x = i / paradas;
        const a = forca * (1 - suave5(x));
        ps.push(`color-mix(in srgb, ${cor} ${(a * 100).toFixed(2)}%, transparent) ${(x * ate).toFixed(2)}%`);
      }
      return `radial-gradient(${forma} at ${cx}% ${cy}%, ${ps.join(', ')})`;
    }

    const fx = {
      gradienteDeLuz,
      /** Desfoque direcional de obturador (filtro SVG por elemento), proporcional à velocidade em cqw/s. */
      obturador(el, vx = 0, vy = 0, { fator = 0.006 } = {}) {
        if (!el) return;
        const sx = Math.round(Math.abs(vx) * fator * u * 4) / 4;
        const sy = Math.round(Math.abs(vy) * fator * u * 4) / 4;
        if (!el.__mObt) {
          const svg = svgDoMotor();
          const NS = 'http://www.w3.org/2000/svg';
          const f = document.createElementNS(NS, 'filter');
          const id = `m-obt-${R.id}-${++contadorFiltro}`;
          f.setAttribute('id', id);
          f.setAttribute('x', '-50%');
          f.setAttribute('y', '-50%');
          f.setAttribute('width', '200%');
          f.setAttribute('height', '200%');
          f.setAttribute('color-interpolation-filters', 'sRGB');
          const g = document.createElementNS(NS, 'feGaussianBlur');
          g.setAttribute('stdDeviation', '0 0');
          f.appendChild(g);
          svg.appendChild(f);
          el.__mObt = { id, g };
        }
        el.__mObt.g.setAttribute('stdDeviation', `${sx} ${sy}`);
        el.style.filter = sx > 0 || sy > 0 ? `url(#${el.__mObt.id})` : 'none';
      },
      /** Velocidade (derivada numérica) de uma função de posição, em unidades/s. */
      velocidade(posEm, t, h = 0.008) {
        return (posEm(t + h) - posEm(t - h)) / (2 * h);
      },
      /** Luz macia sem borda visível: pinta o fundo do elemento com um degradê radial de muitas paradas. */
      halo(el, { cor = 'var(--luz-1)', forca = 0.6, forma = 'ellipse', ate = 70 } = {}) {
        if (!el) return;
        el.style.backgroundImage = gradienteDeLuz(cor, forca, { forma, ate });
      },
      /** Luz que respira (opacidade e escala), período longo, sem começo nem fim visíveis; passa pelo
          aprovado em ref. `api.set` substitui o transform inteiro: se o mesmo elemento também deriva,
          passe a deriva em `junto` ({ x, y, r, s }) em vez de chamar set duas vezes. */
      respirar(t, el, { inicio = 0, periodo = 3.5, amp = 0.06, fase = 0, base = 1, junto = null } = {}) {
        if (!el) return;
        const v = api.vida(t, { inicio, periodo, amp: 1, fase });
        const j = junto || {};
        api.set(el, { o: clamp(base * (1 + amp * v)), s: (1 + amp * 0.3 * v) * (j.s ?? 1), x: j.x || 0, y: j.y || 0, r: j.r || 0 });
      },
      /** Nasce quente e esfria até a cor final: q = 1 quente, 0 assentado. Com `cor`, a peça nasce
          na cor de brasa (texto: a cor da letra; objeto: um brilho colorido em volta) em vez de só
          clarear; em texto claro, calor só por brilho vira mancha cinza. */
      calor(el, q, { calor = 2.2, cor = null } = {}) {
        if (!el) return;
        q = clamp(q);
        if (cor && api.tipo) {
          api.tipo.pintarCalor(el, q, cor);
          api.set(el, { bright: 1 + 0.3 * q });
          return;
        }
        api.set(el, { bright: 1 + (calor - 1) * q });
      },
      /** O objeto nasce do ponto de luz em que a cena anterior terminou (entrada por "na-cena" ou
          "ponto-de-luz"): cresce de `de` em log, quente, e esfria. Devolve { s, bright, o } (some ao
          resto do estado do objeto e aplique uma vez). */
      nascerDoPonto(t, { inicio = 0, dur = 0.45, de = 0.22 } = {}) {
        const e = ease.outExpo(prog(t, inicio, inicio + dur));
        return { s: api.logLerp(de, 1, e), bright: 1 + 1.4 * (1 - ease.outCubic(prog(t, inicio, inicio + dur * 1.5))), o: suave(prog(t, inicio, inicio + 0.06)) };
      },
      /** Desenha um traço SVG de 0 a 1 (p) sem o ponto da ponta redonda antes de começar e sem
          pedaço solto: pathLength 1, opacidade com rampa nos primeiros 5 % do desenho. */
      desenharTraco(path, p, { rampa = 0.05 } = {}) {
        if (!path) return;
        if (!path.__mTraco) {
          path.setAttribute('pathLength', '1');
          path.__mTraco = true;
        }
        p = clamp(p);
        path.style.strokeDasharray = p <= 0 ? '0 1' : '1 1';
        path.style.strokeDashoffset = (1 - p).toFixed(5);
        path.style.opacity = suave(prog(p, 0, rampa)).toFixed(4);
      },
      /** Revela no sentido da leitura (marca, palavra, faixa): máscara de borda macia que anda de 0
          (nada) a 1 (tudo), sem nenhuma letra quebrada parada. angulo 90 = da esquerda para a direita.
          fixo: fração (0..1, no sentido da máscara) que fica visível desde o começo, com borda seca
          (ponha a borda no vão entre o símbolo e o nome: ninguém vê a borda num vão vazio). */
      revelarNaLeitura(el, p, { angulo = 90, suavidade = 0.22, fixo = 0 } = {}) {
        if (!el) return;
        p = clamp(p);
        if (p >= 1) return api.set(el, { mask: 'none' });
        const pos = lerp(fixo - suavidade / 2, 1 + suavidade / 2, p);
        const ps = [];
        for (let i = 0; i <= 6; i++) {
          const k = i / 6;
          ps.push(`rgba(0,0,0,${(1 - suave5(k)).toFixed(4)}) ${((pos - suavidade / 2 + suavidade * k) * 100).toFixed(2)}%`);
        }
        const revela = `linear-gradient(${angulo}deg, ${ps.join(', ')})`;
        const f = (fixo * 100).toFixed(2);
        api.set(el, { mask: fixo > 0 ? `linear-gradient(${angulo}deg, #000 0%, #000 ${f}%, transparent ${f}%), ${revela}` : revela });
      },
      /** Envelope de flash sem ataque seco: sobe em `subida` s e decai em `dur` s (0..1). */
      flash(t, t0, { subida = 0.07, dur = 0.9 } = {}) {
        if (t <= t0 - subida) return 0;
        if (t < t0) return suave((t - (t0 - subida)) / subida);
        return 1 - ease.outExpo(prog(t, t0, t0 + dur)) * 0.999;
      },
      /** Máscara linear macia: pos 0..1 ao longo do ângulo; suavidade em fração do quadro. */
      mascaraLinear(el, { angulo = 90, pos = 0.5, suavidade = 0.15, inverter = false } = {}) {
        const a = clamp(pos - suavidade / 2, -1, 2) * 100, b = clamp(pos + suavidade / 2, -1, 2) * 100;
        const [c1, c2] = inverter ? ['transparent', '#000'] : ['#000', 'transparent'];
        const m = `linear-gradient(${angulo}deg, ${c1} ${a.toFixed(2)}%, ${c2} ${b.toFixed(2)}%)`;
        api.set(el, { mask: m });
      },
      /** Máscara radial macia (cx, cy em %; raio em % da diagonal). Prefira bordas largas: nada de íris dura. */
      mascaraRadial(el, { cx = 50, cy = 50, raio = 50, suavidade = 30 } = {}) {
        const r0 = Math.max(0, raio - suavidade / 2), r1 = raio + suavidade / 2;
        const ps = [];
        for (let i = 0; i <= 8; i++) {
          const x = i / 8;
          ps.push(`rgba(0,0,0,${(1 - suave5(x)).toFixed(4)}) ${(r0 + (r1 - r0) * x).toFixed(2)}%`);
        }
        api.set(el, { mask: `radial-gradient(circle at ${cx}% ${cy}%, ${ps.join(', ')})` });
      },
      /** Cada elemento acende quando uma frente vinda do ponto alcança a borda mais próxima dele.
          Devolve os atrasos (s). ponto em cqw a partir do centro; velocidade em cqw/s. */
      ondaDeLuz(ponto, elementos, { velocidade = 120 } = {}) {
        return elementos.map((el) => {
          const b = api.caixa(el.el || el);
          const dx = Math.max(b.x - ponto[0], 0, ponto[0] - (b.x + b.l));
          const dy = Math.max(b.y - ponto[1], 0, ponto[1] - (b.y + b.a));
          return Math.hypot(dx, dy) / velocidade;
        });
      },
      /** Rufar: n tempos com intervalos que encurtam (de → ate). Devolve os instantes relativos. */
      accelerando(n, { de = 0.045, ate = 0.017 } = {}) {
        const out = [0];
        for (let i = 1; i < n; i++) out.push(out[i - 1] + lerp(de, ate, (i - 1) / Math.max(1, n - 2)));
        return out;
      },
      /** O degradê de fundo de um elemento gira um fio (vida), passando pelo aprovado em ref. */
      degradeQueDeriva(el, t, { graus = 4, periodo = 6, ref = api.ref, inicio = 0 } = {}) {
        if (!el) return;
        if (el.__mFundo === undefined) el.__mFundo = getComputedStyle(el).backgroundImage;
        const ang = graus * Math.sin((2 * Math.PI * (t - ref)) / periodo) * suave5(prog(t, inicio, inicio + 0.8));
        el.style.backgroundImage = el.__mFundo.replace(/linear-gradient\((-?[\d.]+)deg/g, (m, a) => `linear-gradient(${(parseFloat(a) + ang).toFixed(3)}deg`);
      },
      rand,
    };

    /* ─── pintura (armadilhas do Chrome que viram trancos) ─── */
    const pintura = {
      /** Camada própria decidida no montar (nunca liga/desliga por quadro). */
      camada(el) {
        if (el) el.style.willChange = 'transform';
      },
      /** O filtro fica ligado a cena toda (blur 0 quando não usa): ligar/desligar muda o desenho. */
      filtroFixo(el) {
        if (el) {
          el.__mFiltroFixo = true;
          if (!el.style.filter) el.style.filter = 'blur(0px)';
        }
      },
      /** Força repintura invisível por quadro (imagem parada que reaproveita pintura antiga). */
      repintar(el, t) {
        if (el) el.style.boxShadow = `0 0 0 ${(0.0001 + t * 0.0001).toFixed(6)}px transparent`;
      },
    };

    api.fisica = fisica;
    api.fx = fx;
    api.pintura = pintura;
  });
})();
